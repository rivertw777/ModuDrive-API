spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 10000
      # Calls go through the task's Service Connect Envoy, which closes connections idle past its
      # timeout; the default 900s would keep reusing one it already closed. Expired ones are evicted.
      httpclient:
        time-to-live: 30

# No aspect orders set: Resilience4j's default, Retry ( CircuitBreaker ( call ) ). The circuit breaker
# records every attempt, and the fallback sits on @Retry so it only runs once retries are spent.
# Only connect failures are retried (RetryOnConnectFailure), so a 503, an open circuit
# (CallNotPermittedException) or a read timeout is never retried.
resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        # 500ms, then 1s, each ±50% at random: instances retrying the same recovering service
        # don't all hit it on the same beat.
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exception-predicate: com.moduDrive.common.infrastructure.resilience4j.RetryOnConnectFailure
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        # The failure rate over the last 10 seconds, not the last 10 calls: under heavy traffic 10 calls
        # are a few milliseconds, and a blip that short would open the circuit (spec 006 1-1-2).
        slidingWindowType: TIME_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 10s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        record-exceptions:
          - feign.RetryableException
          - feign.FeignException.GatewayTimeout
          - feign.FeignException.BadGateway
          - feign.FeignException.ServiceUnavailable