spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

# No aspect orders set: Resilience4j's default, Retry ( CircuitBreaker ( call ) ). The circuit breaker
# records every attempt, and the fallback sits on @Retry so it only runs once retries are spent.
# CallNotPermittedException isn't in retry-exceptions, so an open circuit is never retried.
resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - feign.RetryableException
          - feign.FeignException.ServiceUnavailable
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 10s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        recordSlowCalls: true
        record-exceptions:
          - feign.RetryableException
          - feign.FeignException.GatewayTimeout
          - feign.FeignException.BadGateway
          - feign.FeignException.TooManyRequests
          - feign.FeignException.ServiceUnavailable