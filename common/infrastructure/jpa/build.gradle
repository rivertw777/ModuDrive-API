group = 'com.modudrive.common.infrastructure.jpa'

repositories {
    mavenCentral()
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Each service owns its schema in src/main/resources/db/migration; Hibernate only validates it.
    api 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    // A span per connection and query, so a slow request's trace shows which SQL took the time.
    api 'net.ttddyy.observation:datasource-micrometer-spring-boot:2.3.0'
    // AuditingConfig reads the caller off the current HTTP request. Servlet API is compileOnly: every
    // consumer is a web service that brings its own.
    implementation 'org.springframework:spring-web'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
}