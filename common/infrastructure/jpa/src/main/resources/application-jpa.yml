spring:
  datasource:
    hikari:
      # Must stay below the callers' Feign read timeout (10s), or with the DB down the caller times out
      # before GlobalExceptionHandler sends its 503. Hikari's default is 30s.
      connection-timeout: 3000
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration in each service); Hibernate only checks it matches.
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
  flyway:
    postgresql:
      # Session-level advisory lock. A non-transactional migration (create index concurrently,
      # .docs/guide/001-db-migration.md section 5) waits for every open transaction, including the one holding
      # Flyway's default transaction-level lock, so it would never finish.
      transactional-lock: false

# DB spans (datasource-micrometer): connection (time holding a pooled connection, pool waits included) and
# query. No ResultSet spans (one per row is noise). Parameter values stay out (the default), they can be PII.
jdbc:
  includes: connection, query
---
# Local test users (test / test2). db/seed only ships in services that seed — never applied outside dev.
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
