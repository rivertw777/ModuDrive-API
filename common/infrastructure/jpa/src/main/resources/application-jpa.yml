spring:
  datasource:
    hikari:
      # Hikari's 30s default outlasts a caller's Feign read timeout (10s): with the DB down, the 503
      # (GlobalExceptionHandler) would only be sent after the caller gave up on a read timeout.
      connection-timeout: 3000
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration in each service); Hibernate only checks it matches.
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
  flyway:
    postgresql:
      # Session-level advisory lock instead of Flyway's default transaction-level one. A migration run
      # outside a transaction (create index concurrently, .docs/guide/001-db-migration.md 5장) waits for
      # every open transaction to end — Flyway's own lock transaction included, so it would never finish.
      transactional-lock: false

# DB spans (datasource-micrometer). Connection span = time holding a pooled connection (pool waits show
# up here), query span = one statement. ResultSet fetches are left out — a span per row read is noise.
# Parameter values stay out of spans (include-parameter-values defaults to false) — they can be PII.
jdbc:
  includes: connection, query
---
# Local test users (test / test2). db/seed only ships in services that seed — never applied outside dev.
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
