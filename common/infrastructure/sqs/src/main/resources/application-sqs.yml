# Shared by every SQS service (member/file/auth produce via the outbox; file/mail/notification/storage consume).
# Locally SPRING_CLOUD_AWS_SQS_ENDPOINT points at LocalStack with dummy keys; on AWS it is unset and the SDK's
# default chain (ECS task role, AWS_REGION) applies. Queues, DLQs and redrive policies are defined in
# .docker/localstack/init-aws.sh locally and Terraform on AWS.
spring:
  cloud:
    aws:
      sqs:
        # Traces continue from producer to consumer through the traceparent message attribute.
        observation-enabled: true
        # A missing queue is a deploy bug; auto-creating it would skip the DLQ/redrive setup.
        queue-not-found-strategy: fail
