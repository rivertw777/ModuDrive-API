group = 'com.modudrive.common.infrastructure.messaging'

repositories {
    mavenCentral()
}

dependencies {
    // Broker-agnostic: no SQS here. The adapter (common:infrastructure:sqs) implements MessagePublisher.
    // Storage backends are optional — a service brings the one it has (its own DB, else Redis).
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-jackson'
    implementation 'org.springframework:spring-tx'
    implementation 'io.micrometer:micrometer-tracing'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // MessageConversionException, one of the permanent failure types the list names.
    testImplementation 'org.springframework:spring-messaging'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
}
