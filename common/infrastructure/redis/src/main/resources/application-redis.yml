spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      # ElastiCache with in-transit encryption only accepts TLS; its Amazon-issued certificate passes the
      # JVM's default trust store, so no bundle is needed. Local Redis has no TLS.
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      # Cluster mode (MemoryDB, prod) is switched on by SPRING_DATA_REDIS_CLUSTER_NODES and
      # SPRING_DATA_REDIS_USERNAME (ACL user); without them the standalone host above is used. In cluster
      # mode the topology is refreshed on MOVED/ASK and reconnect errors, and every 30s.
      lettuce:
        cluster:
          refresh:
            adaptive: true
            period: 30s
