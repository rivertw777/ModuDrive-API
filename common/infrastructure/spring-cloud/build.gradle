group = 'com.modudrive.common.infrastructure.spring-cloud'

repositories {
    mavenCentral()
}

dependencies {
    api 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // Instruments Feign calls and propagates traceparent; without it the callee starts a new trace.
    api 'io.github.openfeign:feign-micrometer'
    // Apache HttpClient 5 instead of the JDK HttpURLConnection: a connection pool, and distinct connect vs read
    // timeout exceptions, which RetryOnConnectFailure relies on.
    api 'io.github.openfeign:feign-hc5'
}
