management:
  # Actuator on its own port, outside the gateway's Spring Security chain, so Prometheus can scrape it
  # without auth. Never publish this port to the host.
  server:
    port: 9464
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/traces
  tracing:
    sampling:
      # Export everything; the otel-collector's tail_sampling decides what is kept
      # (.docker/observability/otel-collector-config.yaml).
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      # Request histograms for latency alerts (the slow-request rule reads the 1s bucket) and exemplars
      # linking to Tempo. A few fixed buckets instead of percentiles-histogram's ~70 to keep series count
      # down (AMP bills per sample). 1s must match the collector's latency policy so slow-bucket exemplars
      # point at kept traces.
      slo:
        http.server.requests: 100ms, 300ms, 1s, 3s, 10s
        spring.cloud.gateway.requests: 100ms, 300ms, 1s, 3s, 10s

logging:
  structured:
    format:
      # One-line JSON console logs, so traceId/spanId are searchable fields in Loki and CloudWatch Logs Insights.
      console: ecs
