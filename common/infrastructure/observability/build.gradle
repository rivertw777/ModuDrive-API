group = 'com.modudrive.common.infrastructure.observability'

repositories {
    mavenCentral()
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-actuator'
    // Boot 4 ships tracing auto-config in its own module; with only the bridge there is no Tracer bean and no spans.
    api 'org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry'
    api 'io.micrometer:micrometer-tracing-bridge-otel'
    // One version for every OTel artifact, the instrumentation ones (no version below or in the services) and
    // the SDK it is built on: this BOM imports opentelemetry-bom 1.67, which fixes GHSA-ccrj-gw8r-854m — the
    // Boot BOM still ships 1.62.
    api platform('io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha:2.33.1-alpha')
    api 'io.opentelemetry:opentelemetry-exporter-otlp'
    api 'io.micrometer:micrometer-registry-prometheus'
    // Logback → OTLP (LogExportAutoConfiguration).
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0'
    // AwsSdkTracingAutoConfiguration: on only in a service that brings both itself (mail-service).
    compileOnly 'io.opentelemetry.instrumentation:opentelemetry-aws-sdk-2.2'
    compileOnly platform('io.awspring.cloud:spring-cloud-aws-dependencies:4.1.1')
    compileOnly 'io.awspring.cloud:spring-cloud-aws-autoconfigure'
    testImplementation 'io.opentelemetry.instrumentation:opentelemetry-aws-sdk-2.2'
    testImplementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:4.1.1')
    testImplementation 'io.awspring.cloud:spring-cloud-aws-autoconfigure'
    testImplementation 'software.amazon.awssdk:ses'
    // For UserIdObservationFilter: servlet services bring it at runtime; the gateway (WebFlux) never loads it.
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
}
