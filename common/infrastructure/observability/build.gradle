group = 'com.modudrive.common.infrastructure.observability'

repositories {
    mavenCentral()
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-actuator'
    // Boot 4 ships tracing auto-config in its own module; with only the bridge there is no Tracer bean and no spans.
    api 'org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry'
    api 'io.micrometer:micrometer-tracing-bridge-otel'
    api 'io.opentelemetry:opentelemetry-exporter-otlp'
    api 'io.micrometer:micrometer-registry-prometheus'
    // For UserIdObservationFilter: servlet services bring it at runtime; the gateway (WebFlux) never loads it.
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-web'
}
