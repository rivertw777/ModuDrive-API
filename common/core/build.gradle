group = 'com.modudrive.common.core'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':common:infrastructure:spring-cloud')

    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework:spring-web'
    // Services inject the Jackson 2 ObjectMapper (GlobalExceptionHandler, InternalTokenFilter, ...); Boot 4 only
    // auto-configures it with spring-boot-jackson2, which used to arrive transitively via eureka-client.
    api 'org.springframework.boot:spring-boot-jackson2'
    implementation 'jakarta.servlet:jakarta.servlet-api'
}
