# Two jobs, in order (002-aws-migration.md 2-3):
#   terraform — demo only: plan and apply .infra/ with envs/demo.tfvars, so a merge of dev into
#               demo brings the infrastructure along with the code
#   deploy    — ships the app: tests and builds the changed services' images tagged with the commit
#               SHA, pushes them to ECR, registers a new revision of each one's task definition with the
#               new image and rolls the service to it. Terraform never rolls a service back (.infra/ecs.tf ignores the
#               running revision).
#
# Which environment: push to demo → demo, push to prod → prod (app only), or run it by hand for any.
# Each environment is a GitHub environment holding AWS_DEPLOY_ROLE_ARN (terraform output
# github_deploy_role_arn); put required reviewers on prod there. The terraform job runs in a separate
# one, demo-terraform, holding AWS_TERRAFORM_ROLE_ARN and TF_STATE_BUCKET — limit it to the demo branch.
name: deploy

on:
  push:
    branches: [demo, prod]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [demo, prod]

# One deploy per environment at a time; a second waits instead of racing the first.
concurrency:
  group: deploy-${{ inputs.environment || (github.ref_name == 'prod' && 'prod' || 'demo') }}
  cancel-in-progress: false

permissions:
  id-token: write # OIDC → AWS, no stored keys
  contents: read

env:
  AWS_REGION: ap-northeast-2
  PROJECT: modudrive
  SERVICES: gateway member auth file storage mail notification
  TAG: ${{ github.sha }}

jobs:
  terraform:
    if: (inputs.environment || (github.ref_name == 'prod' && 'prod' || 'demo')) == 'demo'
    runs-on: ubuntu-latest
    environment: demo-terraform
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .infra
    steps:
      - id: ready
        working-directory: .
        run: |
          if [ -z "${{ vars.AWS_TERRAFORM_ROLE_ARN }}" ] || [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "::notice::AWS_TERRAFORM_ROLE_ARN or TF_STATE_BUCKET is not set — no stack to apply to yet"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'

      - uses: hashicorp/setup-terraform@v3
        if: steps.ready.outputs.ok == 'true'
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan
        if: steps.ready.outputs.ok == 'true'
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        # image_tag=template: Terraform's task-definition revision is only the template the deploy job
        # copies and fills with the commit's image, so its own tag stays fixed and a plan shows only
        # real changes — a commit SHA here would replace all seven task definitions on every push.
        run: |
          terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
          terraform plan -input=false -var-file=envs/demo.tfvars -var image_tag=template -out=tfplan
          {
            echo '### terraform plan (demo)'
            echo '```'
            # The summary gets each change's one-line header; the full plan is in the plan output above.
            terraform show -no-color tfplan | grep -E '^\s+# |^Plan:|^No changes' | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A merge must never take data with it: if the plan destroys or replaces anything that holds
      # state, stop here — that change is made by hand, after a snapshot (002-aws-migration.md 2-4).
      - name: Refuse to destroy data
        if: steps.ready.outputs.ok == 'true'
        run: |
          terraform show -json tfplan | jq -r '
            .resource_changes[]
            | select(.change.actions | index("delete"))
            | select(.type | test("^aws_(db_instance|rds_cluster|rds_cluster_instance|elasticache_replication_group|memorydb_cluster|s3_bucket|sqs_queue|kms_key|ssm_parameter|secretsmanager_secret)$|^random_(password|bytes)$"))
            | .address' > destroys.txt
          if [ -s destroys.txt ]; then
            echo "::error::The plan deletes stateful resources — apply it by hand:"
            cat destroys.txt
            exit 1
          fi

      - name: Apply
        if: steps.ready.outputs.ok == 'true'
        run: terraform apply -input=false tfplan

  deploy:
    needs: terraform
    # Runs after a successful (or skipped: not demo) terraform job, never after a failed one.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref_name == 'prod' && 'prod' || 'demo') }}
    timeout-minutes: 60
    steps:
      # Until the environment's stack exists there's no role to deploy with — skip instead of failing
      # every push.
      - id: ready
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "::notice::AWS_DEPLOY_ROLE_ARN is not set for this environment — nothing to deploy to yet"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          fetch-depth: 0 # the diff below needs the previous head

      # Which services' code changed since the last push to this branch: only those are tested, built and
      # pushed. The build files and the Dockerfile reach every service. A manual run, or a
      # previous head that isn't in the history (force push), builds everything.
      - id: changes
        if: steps.ready.outputs.ok == 'true'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "build=$SERVICES" >> "$GITHUB_OUTPUT"; echo "all=true" >> "$GITHUB_OUTPUT"
            echo "Building every service (no previous head to compare)"; exit 0
          fi
          files=$(git diff --name-only --no-renames "$BEFORE" HEAD) # a move counts for both modules
          if grep -qE '^(build\.gradle$|settings\.gradle$|gradle/|gradle\.properties$|gradlew|\.docker/Dockerfile$)' <<< "$files"; then
            echo "build=$SERVICES" >> "$GITHUB_OUTPUT"; echo "all=true" >> "$GITHUB_OUTPUT"
            echo "Shared code changed: building every service"; exit 0
          fi
          # A changed common module reaches the services whose project(':…') dependencies lead to it, directly
          # or through another common module. A file under common/ outside any module builds everything.
          # The tests of every common module it reaches run too (modules): only the chosen services are built
          # below, and a service's build compiles the common modules but doesn't test them.
          FILES="$files" python3 - <<'EOF'
          import os, pathlib, re
          files, services = os.environ["FILES"].splitlines(), os.environ["SERVICES"].split()
          deps = {"/".join(p.parent.parts): {d.strip(":").replace(":", "/") for d in re.findall(r"project\(\s*['\"](:[^'\"]+)['\"]", p.read_text())}
                  for p in [*pathlib.Path("common").glob("**/build.gradle"), *pathlib.Path("services").glob("*/build.gradle")]}
          def owner(f):
              return max((m for m in deps if f.startswith(m + "/")), key=len, default=None)
          changed = {owner(f) for f in files if f.startswith(("common/", "services/"))}
          def reaches(m, seen=()):
              return m in changed or any(reaches(d, (*seen, m)) for d in deps.get(m, ()) if d not in seen)
          everything = None in changed
          build = services if everything else [s for s in services if reaches(f"services/{s}-service")]
          modules = sorted(":" + m.replace("/", ":") for m in deps if m.startswith("common/") and reaches(m))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"build={' '.join(build)}\nmodules={' '.join(modules)}\nall={str(everything).lower()}\n")
          print("File outside any module: building every service" if everything
                else f"Changed services: {' '.join(build) or 'none'}; common modules: {' '.join(modules) or 'none'}")
          EOF

      - uses: actions/setup-java@v4
        if: steps.ready.outputs.ok == 'true' && steps.changes.outputs.build != ''
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        if: steps.ready.outputs.ok == 'true' && steps.changes.outputs.build != ''

      # Persistence tests run on Testcontainers Postgres (Docker is on the runner); the SQS queue
      # test needs a LocalStack token — a repository secret, the same for every environment.
      - name: Test and build
        if: steps.ready.outputs.ok == 'true' && steps.changes.outputs.build != ''
        run: |
          if [ "${{ steps.changes.outputs.all }}" = true ]; then
            ./gradlew build
          else
            modules="${{ steps.changes.outputs.modules }}"
            ./gradlew $(printf ':services:%s-service:build ' ${{ steps.changes.outputs.build }}) \
              ${modules:+$(printf '%s:build ' $modules)}
          fi
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        if: steps.ready.outputs.ok == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      # Repositories are immutable: a SHA already pushed (a re-run) is skipped, not overwritten.
      - name: Push images
        if: steps.ready.outputs.ok == 'true' && steps.changes.outputs.build != ''
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          todo=()
          for svc in ${{ steps.changes.outputs.build }}; do
            if aws ecr describe-images --repository-name "$PROJECT/$svc-service" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
              echo "$PROJECT/$svc-service:$TAG already pushed"
            else
              todo+=("$svc")
            fi
          done
          [ ${#todo[@]} -eq 0 ] && exit 0

          # One Gradle run for every context (parallel ones would fight over the build), then the images in parallel.
          ./gradlew -q $(printf ':services:%s-service:prepareDockerContext ' "${todo[@]}")
          pids=()
          for svc in "${todo[@]}"; do
            (
              set -e
              image="$REGISTRY/$PROJECT/$svc-service:$TAG"
              dir="services/$svc-service/build/docker"
              docker build --build-arg JAR_FILE="$(basename "$(ls "$dir"/*.jar)")" --build-arg AOT=true -t "$image" "$dir"
              docker push "$image"
            ) > "push-$svc.log" 2>&1 &
            pids+=($!)
          done
          failed=0
          for i in "${!todo[@]}"; do
            wait "${pids[$i]}" || { echo "::error::${todo[$i]}-service image failed"; failed=1; }
            echo "::group::${todo[$i]}-service"; cat "push-${todo[$i]}.log"; echo "::endgroup::"
          done
          exit $failed

      # Starts from the family's latest revision, so a task-definition change Terraform registered
      # since the last deploy rolls out with this one. Schema changes must suit the old and the new
      # code both: Flyway runs as the first new task starts, while old tasks still serve.
      # A service whose code didn't change rolls out, on its running image, only when the latest revision
      # differs from the running one in more than the image — every apply re-registers the revisions, so
      # their ARNs differ even when nothing in them did.
      - name: Roll out
        if: steps.ready.outputs.ok == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          BUILD: ${{ steps.changes.outputs.build }}
        run: |
          declare -A revision
          rolled=()
          for svc in $SERVICES; do
            aws ecs describe-task-definition --task-definition "$PROJECT-$svc" --query taskDefinition > current.json
            if [[ " $BUILD " == *" $svc "* ]]; then
              image="$REGISTRY/$PROJECT/$svc-service:$TAG"
            else
              running=$(aws ecs describe-services --cluster "$PROJECT" --services "$svc-service" \
                --query 'services[0].taskDefinition' --output text)
              aws ecs describe-task-definition --task-definition "$running" --query taskDefinition > running.json
              strip='del(.containerDefinitions[0].image, .taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)'
              if [ "$(jq -S "$strip" current.json)" = "$(jq -S "$strip" running.json)" ]; then
                echo "$svc-service unchanged"; continue
              fi
              image=$(jq -r '.containerDefinitions[0].image' running.json)
            fi
            jq --arg image "$image" '
              .containerDefinitions[0].image = $image
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            ' current.json > next.json
            revision[$svc]=$(aws ecs register-task-definition --cli-input-json file://next.json \
              --query taskDefinition.taskDefinitionArn --output text)
            aws ecs update-service --cluster "$PROJECT" --service "$svc-service" \
              --task-definition "${revision[$svc]}" >/dev/null
            echo "$svc-service → ${revision[$svc]}"
            rolled+=("$svc")
          done
          [ ${#rolled[@]} -eq 0 ] && { echo "Nothing to roll out"; exit 0; }

          # services-stable gives up after 10 minutes; a slow start on demo's half vCPU can need more.
          service_names=$(printf '%s-service ' "${rolled[@]}")
          for attempt in 1 2 3; do
            aws ecs wait services-stable --cluster "$PROJECT" --services $service_names && break  # word-split on purpose
            [ "$attempt" = 3 ] && { echo "services did not settle"; exit 1; }
          done

          # Stable can also mean the deployment circuit breaker rolled back to the old revision.
          failed=0
          for svc in "${rolled[@]}"; do
            running=$(aws ecs describe-services --cluster "$PROJECT" --services "$svc-service" \
              --query 'services[0].taskDefinition' --output text)
            if [ "$running" != "${revision[$svc]}" ]; then
              echo "::error::$svc-service rolled back to $running"
              failed=1
            fi
          done
          exit $failed
