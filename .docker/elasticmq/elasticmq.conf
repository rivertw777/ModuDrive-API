# Local SQS (ElasticMQ). Mirror of the AWS queues Terraform creates — keep the two in step:
# every queue is standard, a failed message comes back after the visibility timeout, and after
# maxReceiveCount receives (1 try + 3 retries) it moves to its "-dlq" queue.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  "member-signed-up-dlq" { }
  "member-signed-up" {
    defaultVisibilityTimeout = 10 seconds
    deadLettersQueue { name = "member-signed-up-dlq", maxReceiveCount = 4 }
  }

  "mail-verification-requested-dlq" { }
  "mail-verification-requested" {
    defaultVisibilityTimeout = 10 seconds
    deadLettersQueue { name = "mail-verification-requested-dlq", maxReceiveCount = 4 }
  }

  "mail-share-invite-requested-dlq" { }
  "mail-share-invite-requested" {
    defaultVisibilityTimeout = 10 seconds
    deadLettersQueue { name = "mail-share-invite-requested-dlq", maxReceiveCount = 4 }
  }

  "notification-file-shared-dlq" { }
  "notification-file-shared" {
    defaultVisibilityTimeout = 10 seconds
    deadLettersQueue { name = "notification-file-shared-dlq", maxReceiveCount = 4 }
  }
}
