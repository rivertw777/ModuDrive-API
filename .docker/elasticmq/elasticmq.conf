# Local SQS (ElasticMQ). Mirror of the AWS queues Terraform creates — keep the two in step:
# every queue is FIFO, a failed message comes back after the visibility timeout, and after
# maxReceiveCount receives (1 try + 3 retries) it moves to its "-dlq.fifo" queue.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  "member-signed-up-dlq.fifo" { fifo = true }
  "member-signed-up.fifo" {
    fifo = true
    defaultVisibilityTimeout = 10 seconds
    deadLettersQueue { name = "member-signed-up-dlq.fifo", maxReceiveCount = 4 }
  }

  "mail-verification-requested-dlq.fifo" { fifo = true }
  "mail-verification-requested.fifo" {
    fifo = true
    defaultVisibilityTimeout = 10 seconds
    deadLettersQueue { name = "mail-verification-requested-dlq.fifo", maxReceiveCount = 4 }
  }

  "mail-share-invite-requested-dlq.fifo" { fifo = true }
  "mail-share-invite-requested.fifo" {
    fifo = true
    defaultVisibilityTimeout = 10 seconds
    deadLettersQueue { name = "mail-share-invite-requested-dlq.fifo", maxReceiveCount = 4 }
  }

  "notification-file-shared-dlq.fifo" { fifo = true }
  "notification-file-shared.fifo" {
    fifo = true
    defaultVisibilityTimeout = 10 seconds
    deadLettersQueue { name = "notification-file-shared-dlq.fifo", maxReceiveCount = 4 }
  }
}
