name: modudrive-observability

# Traces/metrics/logs stack, split out of docker-compose.infra.yml so it can be
# run (or skipped) independently. modudrive_network is created by `make network`
# (a prerequisite of the infra/observability targets).
#
# 설정은 파일 단위가 아니라 디렉터리 단위로 마운트한다. 단일 파일 bind mount는 컨테이너 생성 시점의
# inode에 묶여서, 에디터 저장/git checkout처럼 파일을 새 inode로 교체하면 컨테이너가 옛 내용을 보거나
# 재시작 시 기동 실패한다.

services:

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    networks:
      - modudrive_network
    ports:
      # 서비스는 전부 modudrive_network 안에서 otel-collector:4318로 붙는다.
      # 호스트 바인딩은 IDE에서 직접 띄운 서비스를 로컬로 붙일 때만 필요 — loopback만 연다.
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    command: ["--config=/etc/modudrive/otel-collector-config.yaml"]
    volumes:
      - ./observability:/etc/modudrive:ro
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.0.0
    networks:
      - modudrive_network
    command: ["-config.file=/etc/modudrive/tempo.yaml"]
    volumes:
      - ./observability:/etc/modudrive:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.6
    networks:
      - modudrive_network
    command: ["-config.file=/etc/modudrive/loki-config.yaml"]
    volumes:
      - ./observability:/etc/modudrive:ro
      - loki_data:/loki
    restart: unless-stopped


  prometheus:
    image: prom/prometheus:v3.14.0
    networks:
      - modudrive_network
    ports:
      - "127.0.0.1:9090:9090"
    # exemplar-storage: keep the trace_id each histogram bucket carries (Grafana links it to Tempo).
    # remote-write-receiver: the collector pushes the metrics here, as demo pushes to Grafana Cloud.
    # retention 14d: demo(Grafana Cloud)와 같다.
    # web.external-url: 알림의 "어느 규칙에서 왔나" 링크(generatorURL)가 이 주소로 만들어진다.
    command: ["--config.file=/etc/modudrive/prometheus.yml", "--storage.tsdb.path=/prometheus", "--enable-feature=exemplar-storage", "--web.enable-remote-write-receiver", "--storage.tsdb.retention.time=14d", "--web.external-url=http://localhost:9090"]
    volumes:
      - ./observability:/etc/modudrive:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  # 알림 규칙은 Prometheus가 평가하고(alert-rules.yaml), 묶어서 디스코드로 보내는 건 이것이다.
  # 메시지 템플릿은 demo와 한 벌(.infra/monitoring/discord.tmpl)이라 그 폴더를 같이 얹는다.
  # 웹후크 주소는 .docker/.env에서 받아 채널별 파일로 쓴다(Alertmanager 설정은 환경 변수를 못 읽는다).
  # 주소가 없는 채널은 service 채널로 보낸다.
  alertmanager:
    image: prom/alertmanager:v0.34.1
    networks:
      - modudrive_network
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      - DISCORD_SERVICE_WEBHOOK_URL=${DISCORD_SERVICE_WEBHOOK_URL:-}
      - DISCORD_INFRA_WEBHOOK_URL=${DISCORD_INFRA_WEBHOOK_URL:-}
      - DISCORD_MESSAGING_WEBHOOK_URL=${DISCORD_MESSAGING_WEBHOOK_URL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /alertmanager/webhooks
        hook() { case "$$1" in https://*) echo "$$1" ;; *) echo "$$DISCORD_SERVICE_WEBHOOK_URL" ;; esac; }
        hook "$$DISCORD_SERVICE_WEBHOOK_URL" > /alertmanager/webhooks/service
        hook "$$DISCORD_INFRA_WEBHOOK_URL" > /alertmanager/webhooks/infra
        hook "$$DISCORD_MESSAGING_WEBHOOK_URL" > /alertmanager/webhooks/messaging
        exec /bin/alertmanager --config.file=/etc/modudrive/alertmanager.yml --storage.path=/alertmanager --web.external-url=http://localhost:9093
    volumes:
      - ./observability:/etc/modudrive:ro
      - ../.infra/monitoring:/etc/alertmanager/shared:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    networks:
      - modudrive_network
    ports:
      - "127.0.0.1:3001:3000"   # 3000은 ModuDrive-WEB(Vite) dev server가 씀
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      # 알림에 들어가는 링크가 이 값으로 만들어진다. 없으면 기본값 3000 — ModuDrive-WEB(Vite) 주소라
      # 클릭하면 엉뚱한 데가 열린다.
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      # provisioning 디렉터리째 덮으면 이미지가 갖고 있는 dashboards/·plugins/가 사라져서
      # 부팅 때마다 에러를 뱉는다. 우리가 쓰는 것만 얹는다.
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/modudrive.yaml:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards/modudrive:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

networks:
  modudrive_network:
    name: modudrive_network
    external: true

volumes:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
