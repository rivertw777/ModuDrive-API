name: modudrive-observability

# Traces/metrics/logs stack, split out of docker-compose.infra.yml so it can be
# run (or skipped) independently. modudrive_network is created by `make network`
# (a prerequisite of the infra/observability targets).
#
# 설정은 파일 단위가 아니라 디렉터리 단위로 마운트한다. 단일 파일 bind mount는 컨테이너 생성 시점의
# inode에 묶여서, 에디터 저장/git checkout처럼 파일을 새 inode로 교체하면 컨테이너가 옛 내용을 보거나
# 재시작 시 기동 실패한다(promtail 무한 재시작 원인).

services:

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    networks:
      - modudrive_network
    ports:
      # 서비스는 전부 modudrive_network 안에서 otel-collector:4318로 붙는다.
      # 호스트 바인딩은 IDE에서 직접 띄운 서비스를 로컬로 붙일 때만 필요 — loopback만 연다.
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    command: ["--config=/etc/modudrive/otel-collector-config.yaml"]
    volumes:
      - ./observability:/etc/modudrive:ro
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.0.0
    networks:
      - modudrive_network
    command: ["-config.file=/etc/modudrive/tempo.yaml"]
    volumes:
      - ./observability:/etc/modudrive:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.6
    networks:
      - modudrive_network
    command: ["-config.file=/etc/modudrive/loki-config.yaml"]
    volumes:
      - ./observability:/etc/modudrive:ro
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.6.8
    networks:
      - modudrive_network
    command: ["-config.file=/etc/modudrive/promtail-config.yaml"]
    volumes:
      - ./observability:/etc/modudrive:ro
      # docker.sock을 :ro로 마운트해도 Docker Engine API 자체는 전부 열린다(호스트 root 상당 권한).
      # 로컬 dev compose 전용 트레이드오프 — 공유 호스트/서버로 절대 승격하지 말 것.
      # .raw = Docker Desktop VM 안의 소켓. WSL 쪽 /var/run/docker.sock을 파일 마운트하면
      # Docker Desktop 재시작 시 WSL 마운트가 준비되기 전에 컨테이너가 떠서 exit 127로 죽는다.
      - /var/run/docker.sock.raw:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    networks:
      - modudrive_network
    ports:
      - "127.0.0.1:9090:9090"
    command: ["--config.file=/etc/modudrive/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./observability:/etc/modudrive:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    networks:
      - modudrive_network
    ports:
      - "127.0.0.1:3001:3000"   # 3000은 ModuDrive-WEB(Vite) dev server가 씀
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      # 알림에 들어가는 링크가 이 값으로 만들어진다. 없으면 기본값 3000 — ModuDrive-WEB(Vite) 주소라
      # 클릭하면 엉뚱한 데가 열린다.
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # alerting/alerts.yaml이 contact point의 웹후크 URL 자리에 치환해서 쓴다.
      # 빈 값이면 Grafana가 프로비저닝 단계에서 죽으므로(webhook url property 없음) 기본값을 준다 —
      # .env에 진짜 URL을 넣기 전까지 알림은 평가되고 전송만 404로 실패한다.
      - DISCORD_MESSAGING_WEBHOOK_URL=${DISCORD_MESSAGING_WEBHOOK_URL:-https://discord.com/api/webhooks/unset}
      - DISCORD_SERVICE_WEBHOOK_URL=${DISCORD_SERVICE_WEBHOOK_URL:-https://discord.com/api/webhooks/unset}
    volumes:
      # provisioning 디렉터리째 덮으면 이미지가 갖고 있는 dashboards/·plugins/가 사라져서
      # 부팅 때마다 에러를 뱉는다. 우리가 쓰는 둘만 각각 얹는다.
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/alerting:/etc/grafana/provisioning/alerting:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

networks:
  modudrive_network:
    name: modudrive_network
    external: true

volumes:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
