name: modudrive-service

services:

  eureka-server:
    image: modu-drive-eureka-server:0.0.1-SNAPSHOT
    networks:
      - modudrive_network
    ports:
      - "10000:10000"
    environment:
      - SERVER_PORT=10000
      - SPRING_PROFILES_ACTIVE=dev
      - eureka.client.serviceUrl.defaultZone=http://eureka-server:10000/eureka/

  gateway-service:
    image: modu-drive-gateway-service:0.0.1-SNAPSHOT
    networks:
      - modudrive_network
    ports:
      - "10001:10001"
    environment:
      - SERVER_PORT=10001
      - SPRING_PROFILES_ACTIVE=dev
      - eureka.client.serviceUrl.defaultZone=http://eureka-server:10000/eureka/
      - FRONTEND_APP_URL=http://localhost:3000
    depends_on:
      member-service:
        condition: service_started

  member-service:
    image: modu-drive-member-service:0.0.1-SNAPSHOT
    networks:
      - modudrive_network
    ports:
      - "10010:10010"
    environment:
      - SERVER_PORT=10010
      - SPRING_PROFILES_ACTIVE=dev
      - eureka.client.serviceUrl.defaultZone=http://eureka-server:10000/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/modu_drive
      - SPRING_DATASOURCE_USERNAME=modudrive
      - SPRING_DATASOURCE_PASSWORD=1234
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      eureka-server:
        condition: service_started

  auth-service:
    image: modu-drive-auth-service:0.0.1-SNAPSHOT
    networks:
      - modudrive_network
    ports:
      - "10011:10011"
    environment:
      - SERVER_PORT=10011
      - SPRING_PROFILES_ACTIVE=dev
      - eureka.client.serviceUrl.defaultZone=http://eureka-server:10000/eureka/
      - JWT_SECRET_KEY=MTgxNzg1NjEwNzE3Nzc1MjA1MDA0NzUwMDQ0OTM1Mjg=
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=modudrive
    depends_on:
      eureka-server:
        condition: service_started

  file-service:
    image: modu-drive-file-service:0.0.1-SNAPSHOT
    networks:
      - modudrive_network
    ports:
      - "10012:10012"
    environment:
      - SERVER_PORT=10012
      - SPRING_PROFILES_ACTIVE=dev
      - eureka.client.serviceUrl.defaultZone=http://eureka-server:10000/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/modu_drive
      - SPRING_DATASOURCE_USERNAME=modudrive
      - SPRING_DATASOURCE_PASSWORD=1234
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      eureka-server:
        condition: service_started

  storage-service:
    image: modu-drive-storage-service:0.0.1-SNAPSHOT
    networks:
      - modudrive_network
    ports:
      - "10013:10013"
    environment:
      - SERVER_PORT=10013
      - SPRING_PROFILES_ACTIVE=dev
      - eureka.client.serviceUrl.defaultZone=http://eureka-server:10000/eureka/
      - STORAGE_S3_ENDPOINT=http://minio:9000
      - STORAGE_S3_BUCKET=modudrive
      - STORAGE_S3_ACCESS_KEY=minioadmin
      - STORAGE_S3_SECRET_KEY=minioadmin
      - STORAGE_S3_REGION=us-east-1
    depends_on:
      eureka-server:
        condition: service_started

  notification-service:
    image: modu-drive-notification-service:0.0.1-SNAPSHOT
    networks:
      - modudrive_network
    ports:
      - "10014:10014"
    environment:
      - SERVER_PORT=10014
      - SPRING_PROFILES_ACTIVE=dev
      - eureka.client.serviceUrl.defaultZone=http://eureka-server:10000/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/modu_drive
      - SPRING_DATASOURCE_USERNAME=modudrive
      - SPRING_DATASOURCE_PASSWORD=1234
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      eureka-server:
        condition: service_started

networks:
  modudrive_network:
    external: true
    name: modudrive_network
