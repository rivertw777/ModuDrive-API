name: modudrive-service

services:

  gateway-service:
    image: modu-drive-gateway-service:0.0.1-SNAPSHOT
    networks:
      - modudrive_network
    ports:
      - "${GATEWAY_SERVER_PORT}:${GATEWAY_SERVER_PORT}"
    environment:
      - SERVER_PORT=${GATEWAY_SERVER_PORT}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - CLIENT_URL=${CLIENT_URL}
    depends_on:
      member-service:
        condition: service_started

  member-service:
    image: modu-drive-member-service:0.0.1-SNAPSHOT
    networks:
      - modudrive_network
    environment:
      - SERVER_PORT=${MEMBER_SERVER_PORT}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/member_db
      - SPRING_DATASOURCE_USERNAME=member_service
      - SPRING_DATASOURCE_PASSWORD=${MEMBER_DB_PASSWORD:?}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_CLOUD_AWS_SQS_ENDPOINT=${SQS_ENDPOINT}
      - SPRING_CLOUD_AWS_REGION_STATIC=${SQS_REGION}
      - SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${SQS_ACCESS_KEY}
      - SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=${SQS_SECRET_KEY}
      - MEMBER_EMAIL_VERIFICATION_TOKEN_EXPIRATION=${MEMBER_EMAIL_VERIFICATION_TOKEN_EXPIRATION}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}

  auth-service:
    image: modu-drive-auth-service:0.0.1-SNAPSHOT
    networks:
      - modudrive_network
    environment:
      - SERVER_PORT=${AUTH_SERVER_PORT}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION}
      - JWT_REFRESH_TOKEN_COOKIE_SECURE=${JWT_REFRESH_TOKEN_COOKIE_SECURE}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}

  file-service:
    image: modu-drive-file-service:0.0.1-SNAPSHOT
    networks:
      - modudrive_network
    environment:
      - SERVER_PORT=${FILE_SERVER_PORT}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/file_db
      - SPRING_DATASOURCE_USERNAME=file_service
      - SPRING_DATASOURCE_PASSWORD=${FILE_DB_PASSWORD:?}
      - MODUDRIVE_FILE_DEFAULT_QUOTA_BYTES=${MODUDRIVE_FILE_DEFAULT_QUOTA_BYTES}
      - SPRING_CLOUD_AWS_SQS_ENDPOINT=${SQS_ENDPOINT}
      - SPRING_CLOUD_AWS_REGION_STATIC=${SQS_REGION}
      - SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${SQS_ACCESS_KEY}
      - SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=${SQS_SECRET_KEY}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}

  storage-service:
    image: modu-drive-storage-service:0.0.1-SNAPSHOT
    networks:
      - modudrive_network
    environment:
      - SERVER_PORT=${STORAGE_SERVER_PORT}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - STORAGE_MULTIPART_MAX_FILE_SIZE=${STORAGE_MULTIPART_MAX_FILE_SIZE}
      - STORAGE_MULTIPART_MAX_REQUEST_SIZE=${STORAGE_MULTIPART_MAX_REQUEST_SIZE}
      - MODUDRIVE_STORAGE_MAX_FILE_SIZE_BYTES=${MODUDRIVE_STORAGE_MAX_FILE_SIZE_BYTES}
      - STORAGE_S3_ENDPOINT=${STORAGE_S3_ENDPOINT}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET}
      - STORAGE_S3_ACCESS_KEY=${STORAGE_S3_ACCESS_KEY}
      - STORAGE_S3_SECRET_KEY=${STORAGE_S3_SECRET_KEY}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION}
      - STORAGE_BLOCK_SIZE=${STORAGE_BLOCK_SIZE}
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY}
      - STORAGE_DOWNLOAD_QUOTA_PER_FILE_BYTES=${STORAGE_DOWNLOAD_QUOTA_PER_FILE_BYTES:-10737418240}
      - STORAGE_DOWNLOAD_QUOTA_WINDOW=${STORAGE_DOWNLOAD_QUOTA_WINDOW:-PT24H}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}

  mail-service:
    image: modu-drive-mail-service:0.0.1-SNAPSHOT
    networks:
      - modudrive_network
    environment:
      - SERVER_PORT=${MAIL_SERVER_PORT}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_CLOUD_AWS_SQS_ENDPOINT=${SQS_ENDPOINT}
      - SPRING_CLOUD_AWS_REGION_STATIC=${SQS_REGION}
      - SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${SQS_ACCESS_KEY}
      - SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=${SQS_SECRET_KEY}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - CLIENT_URL=${CLIENT_URL}

  notification-service:
    image: modu-drive-notification-service:0.0.1-SNAPSHOT
    networks:
      - modudrive_network
    environment:
      - SERVER_PORT=${NOTIFICATION_SERVER_PORT}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notification_db
      - SPRING_DATASOURCE_USERNAME=notification_service
      - SPRING_DATASOURCE_PASSWORD=${NOTIFICATION_DB_PASSWORD:?}
      - SPRING_CLOUD_AWS_SQS_ENDPOINT=${SQS_ENDPOINT}
      - SPRING_CLOUD_AWS_REGION_STATIC=${SQS_REGION}
      - SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${SQS_ACCESS_KEY}
      - SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=${SQS_SECRET_KEY}

networks:
  modudrive_network:
    external: true
    name: modudrive_network
