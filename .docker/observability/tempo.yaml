server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    # 로컬/dev용 파일시스템 백엔드. 운영에서는 아래를 s3로 바꾸고 기존 MinIO(또는 실제 S3)를
    # 그대로 가리키면 된다 — ES 클러스터 운영 부담 없이 확장 가능.
    # MINIO_ROOT_USER/PASSWORD를 그대로 재사용하지 말 것 — modudrive 버킷(사용자 파일)까지 포함한
    # 전체 권한을 트레이싱 백엔드에 주는 셈이 된다. modudrive-tempo 버킷에만 쓰기 권한을 가진
    # 전용 MinIO service account를 발급해서 TEMPO_S3_ACCESS_KEY/SECRET_KEY로 주입할 것.
    # backend: s3
    # s3:
    #   endpoint: minio:9000
    #   bucket: modudrive-tempo
    #   access_key: ${TEMPO_S3_ACCESS_KEY}
    #   secret_key: ${TEMPO_S3_SECRET_KEY}
    #   insecure: true
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
# Tempo 3.0부터 monolithic 모드는 compactor 블록이 없다 (컴팩션이 내부 live-store로 흡수됨).
# 보존기간을 직접 제어하려면 overrides.defaults 쪽을 확인할 것 — 기본값으로도 로컬 dev엔 충분.
