# 알림 규칙 전부 — 설계는 .docs/spec/007-discord-alert-spec.md. Prometheus가 1분마다 평가하고
# Alertmanager(alertmanager.yml)로 넘긴다. AWS에선 같은 규칙이 .infra/monitoring/alert-rules.yaml(AMP)로
# 돈다 — 규칙을 고치면 그쪽도 같이 고친다. 다른 건 확인 명령어(docker·Loki·Tempo ↔ CloudWatch·X-Ray)뿐이다.
#
# outbox: 전송 실패에 횟수 제한이 없어서 인프라 장애가 나도 FAILED 행이 안 생긴다. 테이블만 봐서는 멀쩡해
# 보이므로 감지는 전적으로 이 규칙들에 달려 있다. consumer: 처리에 실패해 DLQ로 빠진 메시지를 본다 —
# 옮겨진 뒤엔 원래 큐가 다시 비어 보인다. services: 그 지표가 아예 안 올 때를 본다.
#
# 알림 이름은 ASCII(AWS에선 SNS 제목이 된다), 메시지에 보이는 이름은 title이다.
# service 라벨은 prometheus.yml이 스크레이프 주소에서 붙인다(AWS는 컨테이너 이름) — 템플릿이 그걸 찍는다.
# 기준값은 괄호 안에 둔다: `and`가 `>`보다 느슨하게 묶여서 `A and B > x`면 비율이 아니라 B(건수)를 비교한다.
groups:
  - name: outbox
    rules:
      # 정상값이 1초 근처(relay가 1초마다 돈다)라 120초면 명백히 비정상이다. 한편 한 틱에 100건씩
      # 빠지므로 일시적인 몰림은 수십 초면 정리된다 — 그걸 장애로 오인하지 않을 만큼은 높다.
      # 5분을 버텨야 알린다: SQS 짧은 장애는 저절로 복구되고 행도 알아서 나간다.
      # 서비스를 내린 것뿐이면 시계열이 없어 울리지 않는다 — 그건 ServiceDown이 본다.
      - alert: OutboxLag
        expr: max by (service, queue) (modudrive_outbox_lag_seconds) > 120
        for: 5m
        labels:
          channel: messaging
        annotations:
          title: 이벤트 전송 적체
          summary: '대기 중인 이벤트가 **{{ printf "%.0f" $value }}초**째 적체 중'
          action: 로그로 원인 확인 후 SQS 복구
          # 적체 지표는 어느 큐가 얼마나 밀렸는지까지만 알지 왜 막혔는지는 모른다 — OutboxRelay는 일시적 실패를
          # 로그로만 남기고 재시도한다. 그 한 줄로 바로 갈 수 있게 쿼리를 싣는다(Grafana → Explore → Loki).
          # 조회 SQL은 싣지 않는다: PENDING 행은 사람이 손댈 게 없고, 밀린 시간은 이미 사유에 있다.
          logs: '{service="{{ $labels.service }}"} |= "Outbox send failed"'

      # FAILED는 사람이 손대기 전까지 사라지지 않는다. 한 건이라도 있으면 그대로 방치된다는 뜻이라
      # 지속 조건 없이 바로 알린다 — 인프라 장애로는 생기지 않으므로 한 번에 한두 건이다.
      - alert: OutboxFailed
        expr: max by (service, queue, reason, detail) (modudrive_outbox_failed) > 0
        labels:
          channel: messaging
        annotations:
          title: 이벤트 전송 실패
          summary: '`{{ $labels.reason }}{{ if $labels.detail }}: {{ $labels.detail }}{{ end }}` ({{ printf "%.0f" $value }}건)'
          action: 이벤트 확인 후 수동 처리
          query: "select id, failed_at, failure_reason from outbox_event where status = 'FAILED' and queue = '{{ $labels.queue }}';"
          recovery: "update outbox_event set status = 'PENDING', failed_at = null, failure_reason = null where id = ?;"

  - name: consumer
    rules:
      # DLQ에 들어간 메시지는 사람이 원인을 고쳐 redrive하기 전까지 스스로 나오지 않는다. 옮겨질 때
      # 로그 한 줄이 남을 뿐 원래 큐는 다시 비어 보이므로, 이 알림이 없으면 보관 기간이 지나 조용히
      # 사라진다. 그래서 한 건이라도 보이면 지속 조건 없이 바로 알린다 — outbox FAILED와 같다.
      # 사유는 메시지마다 다르고 지표로는 셀 수만 있어서, 건수만 말하고 DeadLetterReason을 직접 보라고 한다.
      - alert: DlqMessages
        expr: max by (service, queue) (modudrive_dlq_messages) > 0
        labels:
          channel: messaging
        annotations:
          title: 이벤트 처리 실패
          summary: '`{{ $labels.queue }}`의 DLQ에 **{{ printf "%.0f" $value }}건** 쌓여 있음 (재시도 소진 · 재처리 불가)'
          action: 메시지의 DeadLetterReason으로 원인 확인 후 수정 → 원래 큐로 리드라이브
          # 속성은 기본으로 안 실려 온다 — All을 줘야 DeadLetterReason이 보인다.
          inspect: 'awslocal sqs receive-message --queue-url $(awslocal sqs get-queue-url --queue-name {{ $labels.queue }}-dlq --query QueueUrl --output text) --message-attribute-names All'
          redrive: 'awslocal sqs start-message-move-task --source-arn <{{ $labels.queue }}-dlq의 ARN>'

  - name: services
    rules:
      # up은 Prometheus가 스크레이프 성공 여부로 직접 넣는 값이다(성공 1, 실패 0) — 앱이 내보내는 게 아니라
      # 프로세스가 죽거나 액추에이터가 막히면 바로 0이 된다. 지표가 안 오는 것 자체는 여기서만 알린다.
      # 2분을 버텨야 알린다 — 재배포로 잠깐 내려가는 것까지 알릴 필요는 없다.
      # (AWS엔 ServiceNoTasks가 하나 더 있다: ECS에선 죽은 태스크가 0이 아니라 대상 목록에서 사라진다.)
      - alert: ServiceDown
        expr: min by (service) (up{job="services"}) < 1
        for: 2m
        labels:
          channel: service
        annotations:
          title: 서비스 응답 없음
          summary: 스크레이프가 2분째 실패중 (프로세스 다운 · 액추에이터 응답 없음)
          action: 컨테이너 상태와 앱 로그 확인
          inspect: 'docker ps -a --filter name={{ $labels.service }} / docker logs --tail 100 modudrive-service-{{ $labels.service }}-1'

      # 서비스는 떠 있는데 그 서비스로 가는 호출이 계속 실패하는 경우 — 5xx·타임아웃·Redis/DB 막힘. 스크레이프는
      # 성공하니 위 규칙으로는 안 보인다. 한 번 열린 건 알리지 않는다: 10초 뒤 스스로 다시 확인하고, 재배포 중에도
      # 잠깐 열린다(그건 WARN 로그로 충분). 2분은 위 규칙과 같은 기준이다.
      # half_open도 센다 — 장애가 이어지면 open과 half_open을 10초마다 오가므로 open만 보면 값이 번갈아
      # 바뀌어 for가 계속 초기화된다. 둘을 합쳐야 "닫히지 않은 시간"이 이어진다.
      # service(부르는 쪽)와 name(불리는 쪽 — 서킷 이름이 대상 서비스 기준)으로 묶는다. member-service 하나가
      # 아프면 auth·file·gateway에서 각각 오지만, 어느 경로가 막혔는지 바로 보이는 쪽을 택했다.
      # 요청이 없으면 open에서 half_open으로 넘어가지 않아(automaticTransitionFromOpenToHalfOpenEnabled 기본 false)
      # 대상이 복구된 뒤에도 다음 요청이 올 때까지 해제가 늦을 수 있다.
      - alert: CircuitOpen
        expr: max by (service, name) (resilience4j_circuitbreaker_state{state=~"open|half_open"}) > 0
        for: 2m
        labels:
          channel: service
        annotations:
          title: 서킷 열림
          summary: 2분째 닫히지 않음 — 대상 서비스 호출이 계속 실패 중 (502·503·504 · 타임아웃 · 연결 실패)
          action: 서킷이 부르는 서비스의 상태와 로그로 실패 원인 확인
          inspect: 'docker logs modudrive-service-{{ $labels.service }}-1 2>&1 | grep "{{ $labels.name }}"'

      # 사용자가 실제로 에러를 보고 있는지를 본다. 위 두 규칙은 원인 쪽만 본다 — 프로세스가 죽었나(up),
      # 502/503/504나 연결 실패가 이어지나(서킷). DB·Redis 연결 실패는 GlobalExceptionHandler가 503으로 바꿔 서킷이
      # 잡지만, 버그나 처리 못 한 예외는 500이라 서킷이 세지 않고 up도 1이다. 그래서 게이트웨이를 지난 요청의 5xx 비율을 본다.
      # 5분 동안 5%를 넘고 5xx가 10건 이상일 때만 — 요청이 거의 없을 때 한두 건으로 울리지 않게 건수도 본다.
      # routeId는 게이트웨이 경로 이름이자 대상 서비스 이름이라, 메시지의 대상에 그대로 찍힌다.
      - alert: RouteErrorRate
        expr: >-
          (sum by (routeId) (rate(spring_cloud_gateway_requests_seconds_count{outcome="SERVER_ERROR"}[5m]))
          / sum by (routeId) (rate(spring_cloud_gateway_requests_seconds_count[5m])) > 0.05)
          and on (routeId)
          (sum by (routeId) (increase(spring_cloud_gateway_requests_seconds_count{outcome="SERVER_ERROR"}[5m])) >= 10)
        for: 2m
        labels:
          channel: service
        annotations:
          title: 요청 실패율 높음
          summary: '최근 5분 요청의 **{{ humanizePercentage $value }}**가 5xx로 실패 중'
          action: 그 서비스의 에러 로그로 원인 확인
          inspect: 'docker logs modudrive-service-{{ $labels.routeId }}-1 2>&1 | grep -E "ERROR|Exception"'

      # 에러 없이 느려지는 경우 — DB 쿼리·커넥션 풀 고갈·하위 서비스 지연. 위 규칙들은 실패만 센다.
      # 게이트웨이를 지난 요청 중 1초를 넘긴 비율을 경로별로 본다. 1초는 otel-collector의 slow-requests 정책과
      # 같은 기준이라, 여기 걸린 요청의 trace는 샘플링에 버려지지 않고 전부 Tempo에 있다.
      # le="1.0" 버킷은 application-observability.yml의 slo 버킷 — 거기서 1s를 빼면 이 규칙은 조용히 죽는다.
      # storage-service는 뺀다: 업로드·다운로드는 파일 크기만큼 오래 걸리는 게 정상이라 1초 기준이 의미가 없다.
      # 5xx 규칙과 같은 이유로 건수(10건)도 본다.
      - alert: RouteSlowRate
        expr: >-
          (1 - sum by (routeId) (rate(spring_cloud_gateway_requests_seconds_bucket{le="1.0", routeId!="storage-service"}[5m]))
          / sum by (routeId) (rate(spring_cloud_gateway_requests_seconds_count{routeId!="storage-service"}[5m])) > 0.05)
          and on (routeId)
          ((sum by (routeId) (increase(spring_cloud_gateway_requests_seconds_count{routeId!="storage-service"}[5m]))
          - sum by (routeId) (increase(spring_cloud_gateway_requests_seconds_bucket{le="1.0", routeId!="storage-service"}[5m]))) >= 10)
        for: 2m
        labels:
          channel: service
        annotations:
          title: 느린 요청 많음
          summary: '최근 5분 요청의 **{{ humanizePercentage $value }}**가 1초를 넘김'
          action: Grafana → Explore → Tempo에 아래 쿼리로 느린 trace를 열어 가장 긴 span(DB 쿼리·하위 호출)을 확인
          inspect: '{ resource.service.name = "{{ $labels.routeId }}" && kind = server && duration > 1s }'
