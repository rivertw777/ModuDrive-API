receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # 지표는 demo(.infra/monitoring/otel-collector.yaml)처럼 collector가 긁어 remote write로 Prometheus에 넣는다.
  # 액추에이터는 management.server.port(9464)로 앱 포트와 분리되어 있고, gateway의 SecurityConfig가
  # /actuator/**를 permitAll로 열어 두므로 인증 없이 긁힌다.
  prometheus:
    config:
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: services
          metrics_path: /actuator/prometheus
          static_configs:
            - targets:
                - gateway-service:9464
                - member-service:9464
                - auth-service:9464
                - file-service:9464
                - storage-service:9464
                - mail-service:9464
                - notification-service:9464
          # 알림 규칙과 메시지는 service 라벨로 서비스를 가리킨다 — demo가 컨테이너 이름으로 붙이는 것과
          # 같은 값이다. instance(호스트:포트)는 AWS에선 태스크 IP라 쓰지 않는다.
          relabel_configs:
            - source_labels: [__address__]
              regex: '(.+):\d+'
              target_label: service

processors:
  batch: {}
  # tail-based sampling: 헤드에서는 전량 export 시키고 여기서 "무엇을 남길지" 결정한다.
  # 대규모 트래픽에서 고정 비율 head-sampling만 쓰면 에러 trace가 거의 다 누락되기 때문.
  # decision_wait는 트레이스의 첫 span 기준으로 흐른다 — gateway의 timelimiter(15s)보다는 길게 잡아야
  # 늦게 도착하는 span(정확히 latency 정책이 노리는 느린 요청들)이 결정 전에 다 모인다.
  tail_sampling:
    decision_wait: 30s
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow-requests
        type: latency
        latency:
          threshold_ms: 1000
      - name: baseline-sample
        type: probabilistic
        probabilistic:
          sampling_percentage: 5

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Loki's native OTLP intake: service.name becomes the service_name label, trace_id/span_id and the
  # log attributes (userId, exception) structured metadata.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  # exemplar(버킷마다의 trace_id)도 같이 간다 — Prometheus의 exemplar-storage가 받는다.
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [otlp/tempo]
    # 로그는 샘플링하지 않는다 — trace가 버려진 요청도 로그는 trace_id와 함께 남는다.
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [prometheusremotewrite]
