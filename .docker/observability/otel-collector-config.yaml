extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # 서비스는 OTLP HTTP(:4318)로 보낸다 — demo와 같다.
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  # 지표는 demo(.infra/monitoring/otel-collector.yaml)처럼 collector가 긁어 remote write로 Prometheus에 넣는다.
  # 액추에이터는 management.server.port(9464)로 앱 포트와 분리되어 있고, gateway의 SecurityConfig가
  # /actuator/**를 permitAll로 열어 두므로 인증 없이 긁힌다.
  prometheus:
    config:
      global:
        scrape_interval: 60s # demo와 같다(envs/demo.tfvars의 otel_collector.scrape_interval)
      scrape_configs:
        - job_name: services
          metrics_path: /actuator/prometheus
          static_configs:
            - targets:
                - gateway-service:9464
                - member-service:9464
                - auth-service:9464
                - file-service:9464
                - storage-service:9464
                - mail-service:9464
                - notification-service:9464
          # 알림 규칙과 메시지는 service 라벨로 서비스를 가리킨다 — demo가 컨테이너 이름으로 붙이는 것과
          # 같은 값이다. instance(호스트:포트)는 AWS에선 태스크 IP라 쓰지 않는다.
          relabel_configs:
            - source_labels: [__address__]
              regex: '(.+):\d+'
              target_label: service
          # demo(.infra/monitoring/otel-collector.yaml)와 같은 목록 — 알림과 대시보드가 읽는 것만 남긴다.
          # 새 지표로 알림·패널을 만들려면 두 파일 모두에 먼저 추가한다.
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'modudrive_.*|resilience4j_circuitbreaker_state|resilience4j_circuitbreaker_not_permitted_calls_total|resilience4j_retry_calls_total|resilience4j_timelimiter_calls_total|http_client_requests_seconds_.*|spring_cloud_gateway_requests_seconds_.*|http_server_requests_seconds_.*|jvm_memory_used_bytes|jvm_memory_max_bytes|jvm_gc_live_data_size_bytes|jvm_gc_max_data_size_bytes|jvm_gc_pause_seconds_.*|jvm_threads_live_threads|process_cpu_usage|hikaricp_connections_.*|lettuce_seconds_.*'
              action: keep
            # Feign의 http_url·http_status_code·http_method를 WebClient·서버 지표와 같은 uri·status·method로.
            # 빈 값(다른 지표)은 (.+)에 안 맞아 그대로 둔다.
            - source_labels: [http_url]
              regex: '(.+)'
              target_label: uri
            - source_labels: [http_status_code]
              regex: '(.+)'
              target_label: status
            - source_labels: [http_method]
              regex: '(.+)'
              target_label: method
            - regex: 'http_url|http_status_code|http_method'
              action: labeldrop

processors:
  batch: {}
  # tail-based sampling: 헤드에서는 전량 export 시키고 여기서 "무엇을 남길지" 결정한다.
  # 대규모 트래픽에서 고정 비율 head-sampling만 쓰면 에러 trace가 거의 다 누락되기 때문.
  # decision_wait는 트레이스의 첫 span 기준으로 흐른다 — gateway의 timelimiter(15s)보다는 길게 잡아야
  # 늦게 도착하는 span(정확히 latency 정책이 노리는 느린 요청들)이 결정 전에 다 모인다.
  tail_sampling:
    decision_wait: 30s
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow-requests
        type: latency
        latency:
          threshold_ms: 1000
      - name: baseline-sample
        type: probabilistic
        probabilistic:
          sampling_percentage: 5

exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
  # Loki's native OTLP intake: service.name becomes the service_name label, trace_id/span_id and the
  # log attributes (userId, exception) structured metadata.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  # exemplar(버킷마다의 trace_id)도 같이 간다 — Prometheus의 exemplar-storage가 받는다.
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [otlphttp/tempo]
    # 로그는 샘플링하지 않는다 — trace가 버려진 요청도 로그는 trace_id와 함께 남는다.
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [prometheusremotewrite]
