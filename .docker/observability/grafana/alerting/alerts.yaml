# 알림 규칙 전부 — 설계는 .docs/spec/007-discord-alert-spec.md. AWS에선 같은 규칙이
# .infra/monitoring/alert-rules.yaml(AMP)로 돈다 — 규칙을 고치면 그쪽도 같이 고친다.
#
# outbox: 전송 실패에 횟수 제한이 없어서 인프라 장애가 나도 FAILED 행이 안 생긴다. 테이블만 봐서는 멀쩡해
# 보이므로 감지는 전적으로 이 규칙들에 달려 있다. consumer: 처리에 실패해 DLQ로 빠진 메시지를 본다 —
# 옮겨진 뒤엔 원래 큐가 다시 비어 보인다. services: 그 지표가 아예 안 올 때를 본다.
# UI에서 만들면 grafana_data 볼륨과 함께 사라지니 파일로 둔다.
#
# 받는 곳은 Discord 웹후크 하나. Grafana에 내장된 연동이라 Alertmanager도, 컨테이너 추가도 필요 없다.
# URL은 .docker/.env의 DISCORD_*_WEBHOOK_URL에서 온다(레포에 들어가지 않는다) — 프로비저닝 파일은
# 환경변수를 $VAR로 치환한다.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord-messaging
    receivers:
      - uid: discord-messaging-webhook
        type: discord
        settings: &discord_settings
          url: $DISCORD_MESSAGING_WEBHOOK_URL
          # 기본 템플릿은 Value/Labels/Annotations를 통째로 쏟아낸다. 새벽에 폰으로 보는 사람에게는
          # 항목 이름이 붙은 몇 줄이 낫다 — 무슨 알림인지, 어느 서비스·큐인지, 뭘 해야 하는지, 붙여 쓸 쿼리.
          #
          # Discord는 제목/색만 embed로 그려주고 본문은 그 위에 평문으로 붙인다. 그래서 제목은 짧게 두고
          # (색은 Grafana가 상태에 따라 칠한다) 본문에 항목을 세운다. 쿼리는 문장 안에 넣으면 줄바꿈이
          # 깨지므로 코드 블록으로 뽑고, 링크는 Discord의 작은 글씨(`-# `)로 눌러 본문이 먼저 읽히게 한다.
          #
          # 한 건이면 전부 보여 주고, 여러 건이 한 메시지로 묶이면(group_by가 알림 이름뿐이라 여러 서비스가
          # 동시에 죽으면 그렇다) 건마다 한 줄씩만 쓴다. 건마다 명령어·SQL·링크까지 달면 SilenceURL이 길어
          # 몇 건만 모여도 디스코드 2000자 제한을 넘는다. 건별 상세와 일시 중지는 Grafana 링크에서 본다.
          # "서비스"는 routeId(게이트웨이 경로 = 대상 서비스)가 있으면 그것, 없으면 지표를 낸 서비스다.
          title: '{{ .CommonLabels.alertname }}{{ if eq .Status "resolved" }} (해제){{ end }}'
          message: |
            {{ if eq (len .Alerts) 1 }}
            {{- range .Alerts }}
            {{- if eq .Status "resolved" }}
            ✅  **{{ .Labels.alertname }} (해제)**

            **서비스**: {{ or .Labels.routeId (reReplaceAll ":[0-9]+$" "" .Labels.instance) }}
            {{- if .Labels.queue }}

            **큐**: `{{ .Labels.queue }}`
            {{- end }}
            {{- if .Labels.name }}

            **서킷**: `{{ .Labels.name }}`
            {{- end }}
            {{/* 링크 줄 앞 한 줄 띄우기. 발생 알림은 코드 블록으로 끝나 디스코드가 알아서 띄운다. */}}
            {{- else }}
            🚨  **{{ .Labels.alertname }}**

            **서비스**: {{ or .Labels.routeId (reReplaceAll ":[0-9]+$" "" .Labels.instance) }}
            {{- if .Labels.queue }}

            **큐**: `{{ .Labels.queue }}`
            {{- end }}
            {{- if .Labels.name }}

            **서킷**: `{{ .Labels.name }}`
            {{- end }}

            **사유**: {{ .Annotations.summary }}

            **조치**: {{ .Annotations.action }}
            {{- if .Annotations.inspect }}

            **확인 명령어**
            ```
            {{ .Annotations.inspect }}
            ```
            {{- end }}
            {{- if .Annotations.redrive }}
            {{- /* 앞이 코드 블록이라 여백을 더 주지 않는다 — 복구 쿼리 항목과 같은 이유. */}}
            **SQS 리드라이브 명령어**
            ```
            {{ .Annotations.redrive }}
            ```
            {{- end }}
            {{- if .Annotations.logs }}

            **relay 로그 쿼리** (Grafana → Explore → Loki)
            ```logql
            {{ .Annotations.logs }}
            ```
            {{- end }}
            {{- if .Annotations.query }}

            **이벤트 조회 쿼리**
            ```sql
            {{ .Annotations.query }}
            ```
            {{- end }}
            {{- if .Annotations.recovery }}
            **이벤트 복구 쿼리**
            ```sql
            {{ .Annotations.recovery }}
            ```
            {{- end }}
            {{- end }}
            -# [Grafana에서 보기]({{ .GeneratorURL }}) · [알림 일시 중지]({{ .SilenceURL }})
            {{- end }}
            {{- else }}
            {{- if .Alerts.Firing }}
            🚨  **{{ .CommonLabels.alertname }}** ({{ len .Alerts.Firing }}건)
            {{ range .Alerts.Firing }}
            - {{ or .Labels.routeId (reReplaceAll ":[0-9]+$" "" .Labels.instance) }}{{ if .Labels.queue }} · `{{ .Labels.queue }}`{{ end }}{{ if .Labels.name }} · `{{ .Labels.name }}`{{ end }} — {{ .Annotations.summary }}
            {{- end }}

            **조치**: {{ (index .Alerts.Firing 0).Annotations.action }}
            {{ end }}
            {{- if .Alerts.Resolved }}
            ✅  **{{ .CommonLabels.alertname }} (해제)** ({{ len .Alerts.Resolved }}건)
            {{ range .Alerts.Resolved }}
            - {{ or .Labels.routeId (reReplaceAll ":[0-9]+$" "" .Labels.instance) }}{{ if .Labels.queue }} · `{{ .Labels.queue }}`{{ end }}{{ if .Labels.name }} · `{{ .Labels.name }}`{{ end }}
            {{- end }}
            {{ end }}
            -# [Grafana에서 보기]({{ (index .Alerts 0).GeneratorURL }}) · 건별 명령어와 일시 중지는 Grafana에서
            {{- end }}

  # 서비스 상태 알림(응답 없음, 나중에 CPU·메모리)을 받는 두 번째 채널. 문구는 위와 똑같아야 하므로
  # YAML 병합(<<)으로 한 벌만 두고 웹후크 URL만 바꾼다 — 복사해 두면 한쪽만 고치는 날이 온다.
  - orgId: 1
    name: discord-service
    receivers:
      - uid: discord-service-webhook
        type: discord
        settings:
          <<: *discord_settings
          url: $DISCORD_SERVICE_WEBHOOK_URL

policies:
  - orgId: 1
    # 어느 라벨에도 안 걸린 알림이 가는 곳. 정체를 모르는 알림은 인프라 쪽에서 받는 게 맞다.
    receiver: discord-service
    # 알림 이름 하나 = 메시지 하나. 예전엔 서비스·큐마다 따로 보냈는데, 여럿이 동시에 터지면 웹후크 POST가
    # 한꺼번에 나가 디스코드가 429로 막고, Grafana는 그걸 재시도 없이 버린다 — 재배포로 서비스 7개가 같이
    # 내려갔을 때 3건이 실제로 사라졌다. 큰 장애일수록 알림이 많이 사라지는 셈이라 묶는다. 여러 건이 묶인
    # 메시지는 템플릿이 건마다 한 줄로 줄인다(위 contactPoints).
    group_by: [alertname]
    # 이미 보낸 그룹은 이 간격으로만 다시 보낸다 — 해제 알림도 여기에 묶인다. 기본 5분이면 고친 뒤 해제가
    # 최대 5분 늦게 와서 규칙 평가 주기(1분)에 맞췄다.
    group_interval: 1m
    # 안 고치면 4시간마다 한 번 더 찌른다. 해제되면 Grafana가 알아서 복구 알림을 보낸다.
    repeat_interval: 4h
    # 규칙이 붙인 channel 라벨로 갈린다. 제목이 아니라 라벨로 거는 이유는 알림 제목을 고쳐도
    # 라우팅이 깨지지 않게 하기 위해서다. 둘 다 적어두면 어떤 라벨이 어디로 가는지 여기만 봐도 된다.
    routes:
      - receiver: discord-messaging
        object_matchers:
          - [channel, =, messaging]
      - receiver: discord-service
        object_matchers:
          - [channel, =, service]

groups:
  - orgId: 1
    name: outbox
    folder: ModuDrive
    interval: 1m
    rules:

      # 정상값이 1초 근처(relay가 1초마다 돈다)라 120초면 명백히 비정상이다. 한편 한 틱에 100건씩
      # 빠지므로 일시적인 몰림은 수십 초면 정리된다 — 그걸 장애로 오인하지 않을 만큼은 높다.
      # 5분을 버텨야 알린다: SQS 짧은 장애는 저절로 복구되고 행도 알아서 나간다.
      - uid: outbox-lag
        title: 이벤트 전송 적체
        condition: C
        for: 5m
        labels:
          channel: messaging
        # 서비스를 내린 것뿐인 NoData/오류로는 울리지 않는다 — 그건 이 알림이 볼 문제가 아니다.
        noDataState: OK
        execErrState: OK
        annotations:
          summary: '대기 중인 이벤트가 **{{ printf "%.0f" $values.A.Value }}초**째 적체 중'
          action: '로그로 원인 확인 후 SQS 복구'
          # 적체 지표는 어느 큐가 얼마나 밀렸는지까지만 알지 왜 막혔는지는 모른다 — OutboxRelay는 일시적 실패를 로그로만 남기고
          # 재시도한다. 그 한 줄로 바로 갈 수 있게 쿼리를 알림에 싣는다. 조회 SQL은 싣지 않는다:
          # PENDING 행은 사람이 손댈 게 없고, 밀린 시간은 이미 사유에 있다.
          logs: '{service=~".+-service"} |= "Outbox send failed"'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              editorMode: code
              expr: max by (instance, queue) (modudrive_outbox_lag_seconds)
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [120]

      # FAILED는 사람이 손대기 전까지 사라지지 않는다. 한 건이라도 있으면 그대로 방치된다는 뜻이라
      # 지속 조건 없이 바로 알린다 — 인프라 장애로는 생기지 않으므로 한 번에 한두 건이다.
      - uid: outbox-failed
        title: 이벤트 전송 실패
        condition: C
        for: 0m
        labels:
          channel: messaging
        noDataState: OK
        execErrState: OK
        annotations:
          summary: '`{{ $labels.reason }}{{ if $labels.detail }}: {{ $labels.detail }}{{ end }}` ({{ printf "%.0f" $values.A.Value }}건)'
          action: '이벤트 확인 후 수동 처리'
          query: 'select id, failed_at, failure_reason from outbox_event where status = ''FAILED'' and queue = ''{{ $labels.queue }}'';'
          recovery: 'update outbox_event set status = ''PENDING'', failed_at = null, failure_reason = null where id = ?;'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              editorMode: code
              expr: max by (instance, queue, reason, detail) (modudrive_outbox_failed)
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  - orgId: 1
    name: consumer
    folder: ModuDrive
    interval: 1m
    rules:

      # DLQ에 들어간 메시지는 사람이 원인을 고쳐 redrive하기 전까지 스스로 나오지 않는다. 옮겨질 때
      # 로그 한 줄이 남을 뿐 원래 큐는 다시 비어 보이므로, 이 알림이 없으면 보관 기간(AWS 기본 4일)이
      # 지나 조용히 사라진다. 그래서 한 건이라도 보이면 지속 조건 없이 바로 알린다 — outbox FAILED와 같다.
      - uid: dlq-messages
        title: 이벤트 처리 실패
        condition: C
        for: 0m
        labels:
          channel: messaging
        noDataState: OK
        execErrState: OK
        annotations:
          # 사유는 메시지마다 다르고 지표로는 셀 수만 있다(라벨로 빼려면 DLQ를 실제로 받아 봐야 한다).
          # 그래서 건수만 말하고, 사유는 DeadLetterReason을 직접 보라고 조치에 적는다.
          summary: '`{{ $labels.queue }}`의 DLQ에 **{{ printf "%.0f" $values.A.Value }}건** 쌓여 있음 (재시도 소진 · 재처리 불가)'
          action: '메시지의 DeadLetterReason으로 원인 확인 후 수정 → 원래 큐로 리드라이브'
          # 속성은 기본으로 안 실려 온다 — All을 줘야 DeadLetterReason이 보인다.
          inspect: 'aws sqs receive-message --queue-url <{{ $labels.queue }}-dlq의 URL> --message-attribute-names All'
          redrive: 'aws sqs start-message-move-task --source-arn <{{ $labels.queue }}-dlq의 ARN>'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              editorMode: code
              expr: max by (instance, queue) (modudrive_dlq_messages)
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

  - orgId: 1
    name: services
    folder: ModuDrive
    interval: 1m
    rules:

      # up은 Prometheus가 스크레이프 성공 여부로 직접 넣는 값이다(성공 1, 실패 0) — 앱이 내보내는 게 아니라
      # 프로세스가 죽거나 액추에이터가 막히면 바로 0이 된다. 위 규칙들이 noDataState: OK인 것의 짝이다:
      # 지표가 안 오는 것 자체는 여기서만 알린다.
      # 2분을 버텨야 알린다 — 재배포로 잠깐 내려가는 것까지 알릴 필요는 없다.
      - uid: service-down
        title: 서비스 응답 없음
        condition: C
        for: 2m
        labels:
          channel: service
        noDataState: OK
        execErrState: OK
        annotations:
          summary: '스크레이프가 2분째 실패중 (프로세스 다운 · 액추에이터 응답 없음)'
          # 명령은 문장에 섞지 않고 줄을 바꿔 세운다 — 폰에서 그대로 눈에 들어오게.
          action: '컨테이너 상태와 앱 로그 확인'
          inspect: 'docker ps / docker logs <container>'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              editorMode: code
              expr: min by (instance) (up{job="services"})
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      # 서비스는 떠 있는데 그 서비스로 가는 호출이 계속 실패하는 경우 — 5xx·타임아웃·Redis/DB 막힘. 스크레이프는
      # 성공하니 위 규칙으로는 안 보인다. 한 번 열린 건 알리지 않는다: 10초 뒤 스스로 다시 확인하고, 재배포 중에도
      # 잠깐 열린다(그건 WARN 로그로 충분). 2분은 위 규칙과 같은 기준이다.
      # half_open도 센다 — 장애가 이어지면 open과 half_open을 10초마다 오가므로 open만 보면 값이 번갈아
      # 바뀌어 for가 계속 초기화된다. 둘을 합쳐야 "닫히지 않은 시간"이 이어진다.
      # instance(부르는 쪽)와 name(불리는 쪽 — 서킷 이름이 대상 서비스 기준)으로 묶는다. member-service 하나가
      # 아프면 auth·file·gateway에서 각각 오지만, 어느 경로가 막혔는지 바로 보이는 쪽을 택했다.
      # 요청이 없으면 open에서 half_open으로 넘어가지 않아(automaticTransitionFromOpenToHalfOpenEnabled 기본 false)
      # 대상이 복구된 뒤에도 다음 요청이 올 때까지 해제가 늦을 수 있다.
      - uid: circuit-open
        title: 서킷 열림
        condition: C
        for: 2m
        labels:
          channel: service
        noDataState: OK
        execErrState: OK
        annotations:
          summary: '2분째 닫히지 않음 — 대상 서비스 호출이 계속 실패 중 (502·503·504 · 타임아웃 · 연결 실패)'
          action: '서킷이 부르는 서비스의 상태와 로그로 실패 원인 확인'
          inspect: 'docker logs <container> 2>&1 | grep "{{ $labels.name }}"'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              editorMode: code
              expr: max by (instance, name) (resilience4j_circuitbreaker_state{state=~"open|half_open"})
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # 사용자가 실제로 에러를 보고 있는지를 본다. 위 두 규칙은 원인 쪽만 본다 — 프로세스가 죽었나(up),
      # 502/503/504나 연결 실패가 이어지나(서킷). DB·Redis 연결 실패는 GlobalExceptionHandler가 503으로 바꿔 서킷이
      # 잡지만, 버그나 처리 못 한 예외는 500이라 서킷이 세지 않고 up도 1이다. 그래서 게이트웨이를 지난 요청의 5xx 비율을 본다.
      # 5분 동안 5%를 넘고 5xx가 10건 이상일 때만 — 요청이 거의 없을 때 한두 건으로 울리지 않게 건수도 본다.
      # routeId는 게이트웨이 경로 이름이자 대상 서비스 이름이라, 메시지의 "서비스"에 그대로 찍힌다.
      - uid: route-error-rate
        title: 요청 실패율 높음
        condition: C
        for: 2m
        labels:
          channel: service
        noDataState: OK
        execErrState: OK
        annotations:
          summary: '최근 5분 요청의 **{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}**가 5xx로 실패 중'
          action: '그 서비스의 에러 로그로 원인 확인'
          inspect: 'docker logs <container> 2>&1 | grep -E "ERROR|Exception"'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              editorMode: code
              expr: >-
                (sum by (routeId) (rate(spring_cloud_gateway_requests_seconds_count{outcome="SERVER_ERROR"}[5m]))
                / sum by (routeId) (rate(spring_cloud_gateway_requests_seconds_count[5m])))
                and on (routeId)
                (sum by (routeId) (increase(spring_cloud_gateway_requests_seconds_count{outcome="SERVER_ERROR"}[5m])) >= 10)
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]

      # 에러 없이 느려지는 경우 — DB 쿼리·커넥션 풀 고갈·하위 서비스 지연. 위 규칙들은 실패만 센다.
      # 게이트웨이를 지난 요청 중 1초를 넘긴 비율을 경로별로 본다. 1초는 otel-collector의 slow-requests 정책과
      # 같은 기준이라, 여기 걸린 요청의 trace는 샘플링에 버려지지 않고 전부 Tempo에 있다.
      # le="1.0" 버킷은 application-observability.yml의 slo 버킷 — 거기서 1s를 빼면 이 규칙은 조용히 죽는다.
      # storage-service는 뺀다: 업로드·다운로드는 파일 크기만큼 오래 걸리는 게 정상이라 1초 기준이 의미가 없다.
      # 5xx 규칙과 같은 이유로 건수(10건)도 본다.
      - uid: route-slow-rate
        title: 느린 요청 많음
        condition: C
        for: 2m
        labels:
          channel: service
        noDataState: OK
        execErrState: OK
        annotations:
          summary: '최근 5분 요청의 **{{ with $values.A }}{{ humanizePercentage .Value }}{{ end }}**가 1초를 넘김'
          action: 'Grafana → Explore → Tempo에 아래 쿼리로 느린 trace를 열어 가장 긴 span(DB 쿼리·하위 호출)을 확인'
          inspect: '{ resource.service.name = "{{ $labels.routeId }}" && kind = server && duration > 1s }'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              editorMode: code
              expr: >-
                (1 - sum by (routeId) (rate(spring_cloud_gateway_requests_seconds_bucket{le="1.0", routeId!="storage-service"}[5m]))
                / sum by (routeId) (rate(spring_cloud_gateway_requests_seconds_count{routeId!="storage-service"}[5m])))
                and on (routeId)
                ((sum by (routeId) (increase(spring_cloud_gateway_requests_seconds_count{routeId!="storage-service"}[5m]))
                - sum by (routeId) (increase(spring_cloud_gateway_requests_seconds_bucket{le="1.0", routeId!="storage-service"}[5m]))) >= 10)
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
