# outbox 알람 — 설계는 .docs/spec/messaging-spec.md 2-5.
#
# 전송 실패에 횟수 제한이 없어서 인프라 장애가 나도 FAILED 행이 안 생긴다. 테이블만 봐서는 멀쩡해 보이므로
# 감지는 전적으로 이 두 규칙에 달려 있다. UI에서 만들면 grafana_data 볼륨과 함께 사라지니 파일로 둔다.
#
# 받는 곳은 Discord 웹후크 하나. Grafana에 내장된 연동이라 Alertmanager도, 컨테이너 추가도 필요 없다.
# URL은 .docker/.env의 DISCORD_WEBHOOK_URL에서 온다(레포에 들어가지 않는다) — 프로비저닝 파일은
# 환경변수를 $VAR로 치환한다.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord
    receivers:
      - uid: discord-webhook
        type: discord
        settings:
          url: $DISCORD_WEBHOOK_URL

policies:
  - orgId: 1
    receiver: discord
    group_by: [alertname, instance]
    # 안 고치면 4시간마다 한 번 더 찌른다. 해제되면 Grafana가 알아서 복구 알림을 보낸다.
    repeat_interval: 4h

groups:
  - orgId: 1
    name: outbox
    folder: ModuDrive
    interval: 1m
    rules:

      # 정상값이 1초 근처(relay가 1초마다 돈다)라 120초면 명백히 비정상이다. 한편 한 틱에 100건씩
      # 빠지므로 일시적인 몰림은 수십 초면 정리된다 — 그걸 장애로 오인하지 않을 만큼은 높다.
      # 5분을 버텨야 알린다: SQS 짧은 장애는 저절로 복구되고 행도 알아서 나간다.
      - uid: outbox-lag
        title: outbox 적체
        condition: C
        for: 5m
        # 서비스를 내린 것뿐인 NoData/오류로는 울리지 않는다 — 그건 이 알람이 볼 문제가 아니다.
        noDataState: OK
        execErrState: OK
        annotations:
          summary: '{{ $labels.instance }}의 outbox 전송이 2분 넘게 막혀 있다. SQS와 relay 로그를 볼 것.'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              editorMode: code
              expr: max by (instance) (modudrive_outbox_lag_seconds)
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [120]

      # FAILED는 사람이 손대기 전까지 사라지지 않는다. 한 건이라도 있으면 그대로 방치된다는 뜻이라
      # 지속 조건 없이 바로 알린다 — 인프라 장애로는 생기지 않으므로 한 번에 한두 건이다.
      - uid: outbox-failed
        title: outbox FAILED 행
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        annotations:
          summary: '{{ $labels.instance }}에 사람이 처리해야 할 FAILED 행이 있다. failure_reason을 확인할 것.'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              editorMode: code
              expr: max by (instance) (modudrive_outbox_failed)
              instant: true
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
