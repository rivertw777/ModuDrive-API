apiVersion: 1

# uid 없이 만들어진 예전 Prometheus 데이터소스가 볼륨에 남아 있으면 uid를 붙이는 순간
# "data source not found"로 프로비저닝 전체가 죽는다(Grafana는 uid로 찾는다). 이름으로 먼저 지워서
# 볼륨 상태와 무관하게 아래 정의가 그대로 적용되게 한다 — 삭제가 먼저, 생성이 나중이다.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Histogram buckets carry the trace_id of a request that landed in them (exemplars) — Explore draws
      # them as dots on the graph, and clicking one opens the trace in Tempo.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # trace → 그 trace의 로그 전부(서비스 무관). trace_id는 OTLP로 들어온 로그의 structured metadata다.
      tracesToLogsV2:
        datasourceUid: loki
        customQuery: true
        query: '{service_name=~".+"} | trace_id="$${__trace.traceId}"'

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        # 로그 → trace: structured metadata trace_id로 Tempo를 연다.
        - datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          name: TraceID
          url: '$${__value.raw}'

  # Alerting 화면에서 지금 울리는 알림과 일시 중지(silence)를 본다 — demo(Grafana Cloud)와 같은 화면.
  # 규칙은 Prometheus 데이터소스가 보여 준다. 보내는 건 여전히 Alertmanager다.
  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
