apiVersion: 1

# uid 없이 만들어진 예전 Prometheus 데이터소스가 볼륨에 남아 있으면 uid를 붙이는 순간
# "data source not found"로 프로비저닝 전체가 죽는다(Grafana는 uid로 찾는다). 이름으로 먼저 지워서
# 볼륨 상태와 무관하게 아래 정의가 그대로 적용되게 한다 — 삭제가 먼저, 생성이 나중이다.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus   # alerting/alerts.yaml의 규칙이 이 uid로 참조한다
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Histogram buckets carry the trace_id of a request that landed in them (exemplars) — Explore draws
      # them as dots on the graph, and clicking one opens the trace in Tempo.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        # 서비스 로그는 JSON(logging.structured.format.console: ecs) — "traceId" 필드(32자리 hex)를 뽑는다.
        - datasourceUid: tempo
          matcherRegex: '"traceId":"([0-9a-f]{32})"'
          name: TraceID
          url: '$${__value.raw}'
