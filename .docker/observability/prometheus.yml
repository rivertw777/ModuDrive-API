# 지표는 collector가 remote write로 넣는다(otel-collector-config.yaml) — 여기선 저장하고 알림 규칙만 돌린다.
global:
  evaluation_interval: 1m

# 알림: 규칙은 여기서 평가하고 Alertmanager → Discord로 나간다.
rule_files:
  - /etc/modudrive/alert-rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
