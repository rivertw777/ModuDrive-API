# 알림이 Discord까지 가는 길: Prometheus 규칙(alert-rules.yaml) → 여기 → Discord 웹후크.
# demo(Grafana Cloud)도 같은 설정이다 — 묶음·채널·메시지 템플릿(discord.tmpl)까지 같다.
# 웹후크 주소는 compose가 .docker/.env에서 받아 /alertmanager/webhooks/<채널>에 써 둔다.
route:
  receiver: service
  # 알림 이름 하나 = 메시지 하나. 서비스·큐마다 따로 보내면 여럿이 동시에 터질 때 웹후크 POST가
  # 한꺼번에 나가 디스코드가 429로 막고 일부가 사라진다. 묶인 메시지는 템플릿이 건마다 한 줄로 줄인다.
  group_by: [alertname]
  # 해제도 이 간격에 묶인다 — 기본 5분이면 해제가 최대 5분 늦어서 규칙 평가 주기(1분)에 맞췄다.
  group_interval: 1m
  # 안 고치면 4시간마다 한 번 더 찌른다.
  repeat_interval: 4h
  # 규칙이 붙인 channel 라벨로 웹후크가 갈린다. 라벨이 없으면 service 채널.
  routes:
    # Watchdog(항상 울림)의 heartbeat. demo·prod는 5분마다 바깥 heartbeat 서비스에 ping하고, 로컬은 버린다.
    - receiver: heartbeat
      matchers: [channel="heartbeat"]
      group_wait: 0s
      repeat_interval: 5m
    - receiver: messaging
      matchers: [channel="messaging"]
    - receiver: infra
      matchers: [channel="infra"]

# 원인 알림 하나가 울리면 그 때문에 같이 울리는 알림은 보내지 않는다. 규칙의 target 라벨(대상 서비스)로 맞춘다.
inhibit_rules:
  # 서비스가 죽으면 그 서비스로 가는 서킷·요청 실패·느린 요청 알림이 같이 울린다.
  - source_matchers: [alertname=~"ServiceDown|ServiceNoTasks"]
    target_matchers: [alertname=~"CircuitOpen|RouteErrorRate|RouteSlowRate"]
    equal: [target]
  # collector가 죽으면 AWS에선 ServiceNoTasks가 서비스마다 울린다(로컬엔 이 규칙이 없다).
  - source_matchers: [alertname="CollectorDown"]
    target_matchers: [alertname="ServiceNoTasks"]

templates:
  - /etc/alertmanager/shared/discord.tmpl

receivers:
  - name: heartbeat
  - name: messaging
    discord_configs:
      - webhook_url_file: /alertmanager/webhooks/messaging
        # 본문은 content, 그 아래 카드는 제목만 — 발생은 빨강, 해제는 초록(Alertmanager가 상태로 칠한다).
        content: '{{ template "discord.content" . }}'
        title: '{{ template "discord.title" . }}'
        message: ''
  - name: service
    discord_configs:
      - webhook_url_file: /alertmanager/webhooks/service
        # 본문은 content, 그 아래 카드는 제목만 — 발생은 빨강, 해제는 초록(Alertmanager가 상태로 칠한다).
        content: '{{ template "discord.content" . }}'
        title: '{{ template "discord.title" . }}'
        message: ''
  - name: infra
    discord_configs:
      - webhook_url_file: /alertmanager/webhooks/infra
        # 본문은 content, 그 아래 카드는 제목만 — 발생은 빨강, 해제는 초록(Alertmanager가 상태로 칠한다).
        content: '{{ template "discord.content" . }}'
        title: '{{ template "discord.title" . }}'
        message: ''
