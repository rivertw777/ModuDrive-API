name: modudrive-infra

services:

  postgres:
    image: postgres:18-alpine
    networks:
      - modudrive_network
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Per-service logins, created by postgres/postgres_init.sh
      - MEMBER_DB_PASSWORD=${MEMBER_DB_PASSWORD:?}
      - FILE_DB_PASSWORD=${FILE_DB_PASSWORD:?}
      - NOTIFICATION_DB_PASSWORD=${NOTIFICATION_DB_PASSWORD:?}
      - AUTH_DB_PASSWORD=${AUTH_DB_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - modudrive_network
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Local inbox: every mail LocalStack's SES accepts, whatever the recipient — read them at
  # http://localhost:8025. Nothing is delivered for real, and nothing survives a restart.
  mailpit:
    image: axllent/mailpit:v1.31.4
    networks:
      - modudrive_network
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  # Feeds mailpit from LocalStack's SES store (mailpit/ses-to-mailpit.py) — LocalStack's own SMTP relay
  # is Ultimate-plan only.
  ses-to-mailpit:
    image: python:3.13-alpine
    networks:
      - modudrive_network
    command: ["python", "-u", "/app/ses-to-mailpit.py"]
    volumes:
      # The folder, not the file: a single-file mount breaks once the file is replaced (see localstack below).
      - ./mailpit:/app:ro
    restart: unless-stopped

  # Local stand-in for Amazon SQS, S3, SES, SNS (SES events, alerts), Lambda and SSM (the Discord alert
  # forwarder and its webhook URLs). Queues, the bucket, the sender identity and the alert pipeline come from localstack/init-aws.sh, run
  # on every start. In memory only — the free plan has no persistence, so a restart drops queued
  # messages and every uploaded block while Postgres keeps the file rows: `make reset` after one.
  # localstack_data only caches the license. Needs a (free, non-commercial) auth token.
  localstack:
    image: localstack/localstack:2026.08.3
    networks:
      - modudrive_network
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?set LOCALSTACK_AUTH_TOKEN in .docker/.env}
      - SERVICES=s3,sqs,ses,sns,lambda,ssm
      # The alert forwarder Lambda runs in its own container on this network, so it reaches LocalStack's
      # SSM and the internet (Discord).
      - LAMBDA_DOCKER_NETWORK=modudrive_network
      # Put into SSM for the Lambda, like the by-hand `aws ssm put-parameter` on AWS. Unset = alerts are
      # evaluated and sent, and only the last hop to Discord fails.
      - DISCORD_MESSAGING_WEBHOOK_URL=${DISCORD_MESSAGING_WEBHOOK_URL:-https://discord.com/api/webhooks/unset}
      - DISCORD_SERVICE_WEBHOOK_URL=${DISCORD_SERVICE_WEBHOOK_URL:-https://discord.com/api/webhooks/unset}
      # What the init script creates: queues in the services' SQS_REGION, storage-service's bucket,
      # mail-service's verified sender (SES rejects mail from an unverified one, LocalStack too).
      - AWS_DEFAULT_REGION=${SQS_REGION}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET}
      - STORAGE_S3_REGION=${STORAGE_S3_REGION}
      - MAIL_FROM=${MAIL_FROM}
    volumes:
      - localstack_data:/var/lib/localstack
      # 폴더째 마운트: 파일 하나만 마운트하면 Docker Desktop(WSL) 재시작 때 마운트가 깨져 exit 127로 죽는다.
      - ./localstack:/etc/localstack/init/ready.d:ro
      # The forwarder's code — the same file Terraform zips for AWS.
      - ../.infra/monitoring:/etc/modudrive-alerts:ro
      # LocalStack runs each Lambda as a container. Same caveat as promtail's mount: the Docker Engine API
      # is host-root equivalent — local dev only. (.raw: the socket inside Docker Desktop's VM.)
      - /var/run/docker.sock.raw:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/init/ready | grep -Eq '\"completed\": *true'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

# Observability (otel-collector, tempo, loki, promtail, prometheus, grafana) lives
# in docker-compose.observability.yml — run `make observability` after `make infra`.

networks:
  modudrive_network:
    name: modudrive_network
    external: true

volumes:
  postgres_data:
  redis_data:
  localstack_data:
