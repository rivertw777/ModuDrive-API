name: modudrive-infra

services:

  postgres:
    image: postgres:18-alpine
    networks:
      - modudrive_network
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Per-service logins, created by init/01_postgres_init.sh
      - MEMBER_DB_PASSWORD=${MEMBER_DB_PASSWORD:?}
      - FILE_DB_PASSWORD=${FILE_DB_PASSWORD:?}
      - NOTIFICATION_DB_PASSWORD=${NOTIFICATION_DB_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - modudrive_network
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    networks:
      - modudrive_network
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Local stand-in for Amazon SQS. Queues are declared in elasticmq/elasticmq.conf, in memory only:
  # a restart drops whatever was in flight (the producers' outbox tables still hold anything unsent).
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    networks:
      - modudrive_network
    ports:
      - "127.0.0.1:9324:9324"
    volumes:
      - ./elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    restart: unless-stopped

# Observability (otel-collector, tempo, loki, promtail, prometheus, grafana) lives
# in docker-compose.observability.yml — run `make observability` after `make infra`.

networks:
  modudrive_network:
    name: modudrive_network
    external: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
