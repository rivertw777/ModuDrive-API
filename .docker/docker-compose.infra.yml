name: modudrive-infra

services:

  postgres:
    image: postgres:18-alpine
    networks:
      - modudrive_network
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Per-service logins, created by init/01_postgres_init.sh
      - MEMBER_DB_PASSWORD=${MEMBER_DB_PASSWORD:?}
      - FILE_DB_PASSWORD=${FILE_DB_PASSWORD:?}
      - NOTIFICATION_DB_PASSWORD=${NOTIFICATION_DB_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - modudrive_network
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Local stand-in for Amazon SQS and S3. Queues come from localstack/init-aws.sh (run on every
  # start); the bucket is created by storage-service. PERSISTENCE keeps queues, in-flight messages and
  # uploaded blocks across restarts in localstack_data. Needs a (free, non-commercial) auth token.
  localstack:
    image: localstack/localstack:2026.08.3
    networks:
      - modudrive_network
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?set LOCALSTACK_AUTH_TOKEN in .docker/.env}
      - SERVICES=s3,sqs
      - PERSISTENCE=1
      # Region the init script creates the queues in — the services' SQS_REGION.
      - AWS_DEFAULT_REGION=${SQS_REGION}
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/init/ready | grep -Eq '\"completed\": *true'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

# Observability (otel-collector, tempo, loki, promtail, prometheus, grafana) lives
# in docker-compose.observability.yml — run `make observability` after `make infra`.

networks:
  modudrive_network:
    name: modudrive_network
    external: true

volumes:
  postgres_data:
  redis_data:
  localstack_data:
