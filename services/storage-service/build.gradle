import com.bmuschko.gradle.docker.tasks.image.DockerBuildImage

plugins {
    id 'com.bmuschko.docker-remote-api' version '10.0.0'
}

group = 'com.modudrive.storage'
version = '0.0.1-SNAPSHOT'

bootRun {
    enabled = true
}

bootJar {
    enabled = true
}

bootBuildImage {
    enabled = true
}

afterEvaluate {
    test {
        maxHeapSize = "2048m"
    }
}

dependencies {
    implementation project(':common:core')
    implementation project(':common:api')
    implementation project(':common:event')
    implementation project(':common:infrastructure:observability')
    implementation project(':common:infrastructure:redis')
    implementation project(':common:infrastructure:resilience4j')
    implementation project(':common:infrastructure:spring-cloud')
    implementation project(':common:infrastructure:sqs')
    implementation project(':common:infrastructure:swagger')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'software.amazon.awssdk:s3:2.54.13'
    // S3 calls as spans. Pinned to the release built on the opentelemetry-api the Boot BOM ships (1.62).
    implementation 'io.opentelemetry.instrumentation:opentelemetry-aws-sdk-2.2:2.28.1-alpha'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

task prepareDockerContext(type: Copy) {
    dependsOn bootJar
    from bootJar
    from rootProject.file('.docker/Dockerfile')
    into layout.buildDirectory.dir('docker')
}

task docker(type: DockerBuildImage) {
    dependsOn prepareDockerContext
    inputDir = layout.buildDirectory.dir('docker')
    images.add("${rootProject.name}-${project.name}:${version}")
    buildArgs = ['JAR_FILE': bootJar.archiveFileName.get()]
}
