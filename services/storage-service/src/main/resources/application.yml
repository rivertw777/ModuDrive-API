spring:
  application:
    name: storage-service
  config:
    import:
      - "classpath:application-observability.yml"
      - "classpath:application-redis.yml"
      - "classpath:application-sqs.yml"
      - "classpath:application-resilience4j.yml"

storage:
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT:}  # blank = real AWS S3
    # What presigned upload URLs point at — the browser PUTs blocks there (spec 001 6). Blank = real AWS S3.
    public-endpoint: ${STORAGE_S3_PUBLIC_ENDPOINT:}
    bucket: ${STORAGE_S3_BUCKET}
    access-key: ${STORAGE_S3_ACCESS_KEY:}  # blank = default credential chain (ECS task role)
    secret-key: ${STORAGE_S3_SECRET_KEY:}
    region: ${STORAGE_S3_REGION}
  block-size: ${STORAGE_BLOCK_SIZE}
  # Block upload URLs per user per 24h (spec 001 6-2) — 25,600 × 4MB = 100GB. Caps what uncommitted
  # uploads can pile up in S3 and Redis before the sweep.
  upload-blocks-per-window: ${STORAGE_UPLOAD_BLOCKS_PER_WINDOW:25600}
  # Per-file download volume per rolling window before that file is blocked (Google Drive style).
  # 0 or negative disables the quota.
  download-quota-per-file-bytes: ${STORAGE_DOWNLOAD_QUOTA_PER_FILE_BYTES:10737418240}
  download-quota-window: ${STORAGE_DOWNLOAD_QUOTA_WINDOW:PT24H}

resilience4j:
  retry:
    instances:
      fileServiceRetry:
        baseConfig: default
  circuitbreaker:
    instances:
      fileServiceCircuitBreaker:
        baseConfig: default
      # Spec 006 2-4-3: timeouts, connect failures and S3 5xx count; a 404 or 412 doesn't.
      s3CircuitBreaker:
        baseConfig: default
        record-failure-predicate: com.moduDrive.storage.adapter.out.s3.S3Unavailable
  # Spec 006 2-4-4: S3 never holds more request threads than these, so what doesn't touch S3
  # (signing upload URLs) keeps answering while S3 is slow.
  bulkhead:
    instances:
      # The commit's uploaded-block lookup: HEADs are short, so a moment's wait beats refusing.
      s3Lookup:
        max-concurrent-calls: 40
        max-wait-duration: 1s
      s3Read:
        max-concurrent-calls: 40
        max-wait-duration: 0
      s3Delete:
        max-concurrent-calls: 5
        max-wait-duration: 1s

# Fixed service URLs (compose DNS locally, ECS Service Connect on AWS).
clients:
  file-service:
    url: http://file-service:10012
