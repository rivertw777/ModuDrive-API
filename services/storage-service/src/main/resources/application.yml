spring:
  application:
    name: storage-service
  config:
    import:
      - "classpath:application-observability.yml"
      - "classpath:application-redis.yml"
  servlet:
    multipart:
      # frontend switches to chunked/resumable upload above 20MB (see RESUMABLE_THRESHOLD
      # in ModuDrive-WEB upload-file.ts); this only needs to cover the simple-upload path
      # plus a margin, and the 5MB resumable chunk requests comfortably.
      max-file-size: ${STORAGE_MULTIPART_MAX_FILE_SIZE}
      max-request-size: ${STORAGE_MULTIPART_MAX_REQUEST_SIZE}

modudrive:
  storage:
    max-file-size-bytes: ${MODUDRIVE_STORAGE_MAX_FILE_SIZE_BYTES}

storage:
  s3:
    endpoint: ${STORAGE_S3_ENDPOINT}
    bucket: ${STORAGE_S3_BUCKET}
    access-key: ${STORAGE_S3_ACCESS_KEY}
    secret-key: ${STORAGE_S3_SECRET_KEY}
    region: ${STORAGE_S3_REGION}
  block-size: ${STORAGE_BLOCK_SIZE}
  encryption-key: ${STORAGE_ENCRYPTION_KEY}
  # Per-file download volume per rolling window before that file is blocked (Google Drive style).
  # 0 or negative disables the quota.
  download-quota-per-file-bytes: ${STORAGE_DOWNLOAD_QUOTA_PER_FILE_BYTES:10737418240}
  download-quota-window: ${STORAGE_DOWNLOAD_QUOTA_WINDOW:PT24H}
