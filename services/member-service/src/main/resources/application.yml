spring:
  application:
    name: member-service
  config:
    import:
      - "classpath:application-jpa.yml"
      - "classpath:application-observability.yml"
      - "classpath:application-kafka.yml"
      - "classpath:application-redis.yml"

modudrive:
  member:
    email-verification-token-expiration: ${MEMBER_EMAIL_VERIFICATION_TOKEN_EXPIRATION:180000}

# Shared service-to-service secret: presented on outbound /internal/** calls to file-service,
# and verified on this service's own /internal/** (see InternalTokenFilter).
internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN}
