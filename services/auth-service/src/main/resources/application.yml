spring:
  application:
    name: auth-service
  config:
    import:
      - "classpath:application-observability.yml"
      - "classpath:application-redis.yml"
      - "classpath:application-resilience4j.yml"

session:
  cookie:
    # HTTPS 환경 기본값. 로컬(http)에서만 false로 내린다 — 그때는 __Host- 접두어 없는 이름을 쓴다
    secure: ${SESSION_COOKIE_SECURE:true}

resilience4j:
  retry:
    instances:
      memberServiceRetry:
        baseConfig: default
  circuitbreaker:
    instances:
      memberServiceCircuitBreaker:
        baseConfig: default

# Shared service-to-service secret: sent on calls to member-service's /internal/** routes
# (InternalTokenRequestInterceptorConfig) and verified on this service's own (InternalTokenFilter).
internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN}

# Fixed service URLs (compose DNS locally, ECS Service Connect on AWS).
clients:
  member-service:
    url: http://member-service:10010
