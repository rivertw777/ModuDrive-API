spring:
  application:
    name: auth-service
  config:
    import:
      - "classpath:application-observability.yml"
      - "classpath:application-redis.yml"
      - "classpath:application-resilience4j.yml"

session:
  # spec 004 1-1-4 — 유휴 만료(마지막 사용자 요청 기준) / 절대 만료(로그인 기준)
  idle-timeout: ${SESSION_IDLE_TIMEOUT:30m}
  absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:12h}

resilience4j:
  retry:
    instances:
      memberServiceRetry:
        baseConfig: default
  circuitbreaker:
    instances:
      memberServiceCircuitBreaker:
        baseConfig: default

# Fixed service URLs (compose DNS locally, ECS Service Connect on AWS).
clients:
  member-service:
    url: http://member-service:10010
