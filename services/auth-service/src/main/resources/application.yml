spring:
  application:
    name: auth-service
  config:
    import:
      - "classpath:application-redis.yml"
      - "classpath:application-resilience4j.yml"

jwt:
  secret: ${JWT_SECRET_KEY}
  accessToken:
    expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refreshToken:
    expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
    cookie:
      # HTTPS 환경 기본값. false로 내리면 SameSite도 Lax로 함께 완화된다 (dev 프로파일)
      secure: ${JWT_REFRESH_TOKEN_COOKIE_SECURE:true}

resilience4j:
  retry:
    instances:
      memberServiceRetry:
        baseConfig: default
  circuitbreaker:
    instances:
      memberServiceCircuitBreaker:
        baseConfig: default
