spring:
  application:
    name: mail-service
  config:
    import:
      - "classpath:application-observability.yml"
      - "classpath:application-redis.yml"
      - "classpath:application-sqs.yml"

modudrive:
  messaging:
    idempotency:
      enabled: true
  mail:
    from: ${MAIL_FROM}
    # Publishes SES's Send events (tagged with the delivery id) to the mail-ses-events queue — how a
    # timed-out send is confirmed. Created by init-aws.sh locally, Terraform on AWS.
    configuration-set: mail-events

client:
  url: ${CLIENT_URL}
