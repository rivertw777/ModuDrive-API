spring:
  application:
    name: mail-service
  config:
    import:
      - "classpath:application-observability.yml"
      - "classpath:application-redis.yml"
      - "classpath:application-sqs.yml"

modudrive:
  messaging:
    idempotency:
      enabled: true
  mail:
    from: ${MAIL_FROM}
    # ses (default) or smtp — smtp only while an environment's SES is still in the sandbox (SmtpMailAdapter).
    transport: ${MAIL_TRANSPORT:ses}
    smtp:
      host: ${SMTP_HOST:smtp.gmail.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
    # Publishes SES's Send events (tagged with the delivery id) to the mail-ses-events queue — how a
    # timed-out send is confirmed. Created by init-aws.sh locally, Terraform on AWS.
    configuration-set: mail-events

client:
  url: ${CLIENT_URL}
