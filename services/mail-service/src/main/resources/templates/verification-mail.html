<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ModuDrive 이메일 인증</title>
</head>
<!-- Signup email verification. Table layout + inline styles only — Naver/Daum/Outlook drop
     <style> blocks and flexbox. -->
<body style="margin:0;padding:0;background:#f4f6f9;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f6f9;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:694px;font-family:'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',Arial,sans-serif;color:#1f2937;">
        <tr>
          <td style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:40px 40px 36px;">
            <p style="margin:0 0 12px;font-size:24px;line-height:1.4;font-weight:700;color:#0f172a;">이메일 인증을 완료해주세요</p>
            <p style="margin:0 0 28px;font-size:15px;line-height:1.6;color:#475569;">ModuDrive 회원가입 화면에 아래 인증 코드를 입력하세요.</p>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 28px;">
              <tr>
                <td align="center" style="background:#ecf3f9;border:1px solid #d8e6f3;border-radius:12px;padding:22px 16px;">
                  <span style="font-family:'SF Mono',Menlo,Consolas,monospace;font-size:34px;font-weight:700;letter-spacing:10px;color:#1c3d5a;">{{CODE}}</span>
                </td>
              </tr>
            </table>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0;">
              <tr>
                <td style="background:#fff8e6;border:1px solid #fde7b0;border-radius:12px;padding:14px 18px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td valign="top" style="width:22px;">
                        <img src="cid:warning" width="22" height="22" alt="" style="display:block;border:0;" />
                      </td>
                      <td style="padding-left:12px;font-size:14px;line-height:1.6;color:#6b4e16;">
                        본인이 요청하지 않았다면 이 메일을 무시하세요. 코드는 다른 사람에게 알려주지 마세요.
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 24px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td valign="middle" style="font-size:12px;line-height:1.6;color:#94a3b8;">
                  ModuDrive 회원가입 요청으로 발송된 이메일입니다.
                </td>
                <td valign="middle" align="right" style="padding-left:16px;white-space:nowrap;">
                  <img src="cid:logo" width="122" height="25" alt="ModuDrive" style="display:block;border:0;" />
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
