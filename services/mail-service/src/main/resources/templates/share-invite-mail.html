<div style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;color:#202124;">
  <div style="border:1px solid #dadce0;border-radius:8px;padding:32px;">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px;">
      <span style="display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:#1a73e8;color:#fff;font-size:18px;font-weight:600;flex-shrink:0;">{{GRANTER_INITIAL}}</span>
      <h2 style="font-weight:400;margin:0;font-size:20px;">{{GRANTER_NAME}}님이 항목을 공유함</h2>
    </div>
    <p style="margin:0 0 18px 62px;color:#5f6368;font-size:15px;">{{GRANTER_NAME}}({{GRANTER_EMAIL}})님이 다음 항목을 공유했습니다.</p>
    {{MESSAGE_BLOCK}}
    <p style="margin:18px 0;padding:14px 18px;border:1px solid #dadce0;border-radius:8px;display:flex;align-items:center;gap:10px;font-size:15px;">
      <img src="cid:fileIcon" width="22" height="22" alt="" style="flex-shrink:0;vertical-align:middle;" />{{FILE_NAME}}
    </p>
    <p style="margin-top:26px;margin-bottom:0;">
      <a href="{{LINK}}" style="background:#1a73e8;color:#fff;text-decoration:none;padding:11px 26px;border-radius:4px;display:inline-block;font-size:15px;">열기</a>
    </p>
    {{GUEST_NOTICE}}
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;color:#5f6368;font-size:12px;margin-top:18px;padding:0 4px;">
    <span>{{GRANTER_EMAIL}}님이 ModuDrive에 있는 파일 또는 폴더를 나와 공유하여 발송된 이메일입니다.</span>
    <span style="display:inline-flex;align-items:center;gap:6px;flex-shrink:0;">
      <img src="cid:logo" width="20" height="20" alt="" style="vertical-align:middle;border-radius:6px;" />
      <span style="font-weight:800;color:#0f172a;font-size:15px;">ModuDrive</span>
    </span>
  </div>
</div>
