spring:
  application:
    name: gateway-service
  config:
    import:
      - "classpath:application-core.yml"
      - "classpath:application-observability.yml"
  # Reactive chains hop threads, so the MDC (traceId/spanId in every log line) would be empty
  # without restoring it from the Reactor context on each hop.
  reactor:
    context-propagation: auto
  # Per-route request timer (spring_cloud_gateway_requests_seconds_*) — off by default since Gateway 5.
  # The route error and slow-request alerts read it (spec 009 4).
  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
          # Every backend is reached through this task's Service Connect Envoy, which closes connections
          # idle past its timeout. Dropping ours first keeps a request off one it already closed (a 502).
          httpclient:
            pool:
              max-idle-time: 30s
              eviction-interval: 10s

resilience4j:
  # Spring Cloud CircuitBreaker puts a semaphore bulkhead on every route circuit, sized by this default —
  # Resilience4j's own is 25 at once with no wait, so a route's 26th concurrent request (a long download, say)
  # got a 503. A last guard against requests piling up when a service hangs, set like Envoy's per-cluster
  # max_requests (1024): normal traffic never reaches it. What each service can take, it caps itself
  # (storage-service's S3 bulkheads, spec 006 2-4-4).
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 1024
        max-wait-duration: 0
  timelimiter:
    configs:
      default:
        timeout-duration: 15s
    instances:
      authSessionTimeLimiter:
        timeout-duration: 3s
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 10s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        record-exceptions:
          - java.util.concurrent.TimeoutException
          - io.netty.channel.AbstractChannel$AnnotatedConnectException
          # The target's IP is gone (stopped container, terminated task) — without this a route counts it as success.
          - java.net.NoRouteToHostException
          - java.net.UnknownHostException
          # The session check's connect failure (AuthClient); routes never throw it.
          - org.springframework.web.reactive.function.client.WebClientRequestException
          # A route's 502/503/504 (RouteConfig's statusCodes turns the response into this exception).
          - org.springframework.cloud.gateway.filter.factory.SpringCloudCircuitBreakerFilterFactory$CircuitBreakerStatusCodeException
          # The session check's 502/503/504 from auth-service.
          - org.springframework.web.reactive.function.client.WebClientResponseException$BadGateway
          - org.springframework.web.reactive.function.client.WebClientResponseException$ServiceUnavailable
          - org.springframework.web.reactive.function.client.WebClientResponseException$GatewayTimeout
    instances:
      memberServiceCircuitBreaker:
        baseConfig: default
      authServiceCircuitBreaker:
        baseConfig: default
      fileServiceCircuitBreaker:
        baseConfig: default
      storageServiceCircuitBreaker:
        baseConfig: default
      storageServiceUploadUrlsCircuitBreaker:
        baseConfig: default
      notificationServiceCircuitBreaker:
        baseConfig: default

# /readyz on the public port (actuator itself stays on 9464): what the Route 53 health check calls from
# outside (monitoring.tf), so it walks the user's path — DNS, certificate, WAF, ALB, gateway.
management:
  endpoint:
    health:
      probes:
        add-additional-paths: true

client:
  url: ${CLIENT_URL}

# Fixed service URLs (compose DNS locally, ECS Service Connect on AWS).
clients:
  member-service:
    url: http://member-service:10010
  auth-service:
    url: http://auth-service:10011
  file-service:
    url: http://file-service:10012
  storage-service:
    url: http://storage-service:10013
  notification-service:
    url: http://notification-service:10015
