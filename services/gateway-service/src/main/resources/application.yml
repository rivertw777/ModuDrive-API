spring:
  application:
    name: gateway-service
  config:
    import:
      - "classpath:application-observability.yml"

resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 15s
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 10s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        record-exceptions:
          - java.util.concurrent.TimeoutException
          - org.springframework.cloud.gateway.support.NotFoundException
          - io.netty.channel.AbstractChannel$AnnotatedConnectException
    instances:
      memberServiceCircuitBreaker:
        baseConfig: default
      authServiceCircuitBreaker:
        baseConfig: default
      fileServiceCircuitBreaker:
        baseConfig: default
      storageServiceCircuitBreaker:
        baseConfig: default
      notificationServiceCircuitBreaker:
        baseConfig: default

client:
  url: ${CLIENT_URL}

session:
  cookie:
    # auth-service와 같은 값이어야 한다 — 쿠키 이름이 이 값으로 정해진다 (SessionCookie)
    secure: ${SESSION_COOKIE_SECURE:true}

# Shared service-to-service secret, sent on the session check to auth-service's /internal/**.
internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN}

# Fixed service URLs (compose DNS locally, ECS Service Connect on AWS).
clients:
  member-service:
    url: http://member-service:10010
  auth-service:
    url: http://auth-service:10011
  file-service:
    url: http://file-service:10012
  storage-service:
    url: http://storage-service:10013
  notification-service:
    url: http://notification-service:10015
