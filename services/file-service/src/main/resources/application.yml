spring:
  application:
    name: file-service
  config:
    import:
      - "classpath:application-core.yml"
      - "classpath:application-jpa.yml"
      - "classpath:application-observability.yml"
      - "classpath:application-sqs.yml"
      - "classpath:application-resilience4j.yml"
  cloud:
    openfeign:
      client:
        config:
          # The commit's uploaded-block lookup, storage-service's only call from here: S3 listing
          # pages, or a HEAD per block under 64 hashes, sharing the instance's seats with every
          # other commit. With a HEAD per block, ten 5GB commits at once took ~17s on S3
          # (perf-test 001), past the default 10s; listing isn't measured on S3 yet.
          storage-service:
            read-timeout: 30000
  jpa:
    properties:
      hibernate:
        # A commit writes a version's blocklist (file_version_block, one row per block — 1,280 for a
        # 5GB file) in batches instead of one statement a row.
        jdbc:
          batch_size: 50
        order_inserts: true

modudrive:
  messaging:
    outbox:
      enabled: true
    idempotency:
      enabled: true
  file:
    default-quota-bytes: ${MODUDRIVE_FILE_DEFAULT_QUOTA_BYTES}

resilience4j:
  retry:
    instances:
      memberServiceRetry:
        baseConfig: default
      storageServiceRetry:
        baseConfig: default
  circuitbreaker:
    instances:
      memberServiceCircuitBreaker:
        baseConfig: default
      storageServiceCircuitBreaker:
        baseConfig: default
        # As long as the read timeout: a lookup that just took long isn't a failing service.
        slowCallDurationThreshold: 30s
        # storage-service answers 503 itself when its S3 circuit or bulkhead refuses (spec 006
        # 2-4-5) — already a fast refusal, and counting it would refuse the commits that don't need
        # S3 too. Ignored, not left out of record-exceptions: an instance's list only adds to the
        # base config's, it can't drop one.
        ignore-exceptions:
          - feign.FeignException.ServiceUnavailable

# Fixed service URLs (compose DNS locally, ECS Service Connect on AWS).
clients:
  member-service:
    url: http://member-service:10010
  storage-service:
    url: http://storage-service:10013
