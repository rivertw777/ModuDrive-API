spring:
  application:
    name: file-service
  config:
    import:
      - "classpath:application-jpa.yml"
      - "classpath:application-observability.yml"
      - "classpath:application-sqs.yml"
      - "classpath:application-resilience4j.yml"

modudrive:
  file:
    default-quota-bytes: ${MODUDRIVE_FILE_DEFAULT_QUOTA_BYTES}

resilience4j:
  retry:
    instances:
      memberServiceRetry:
        baseConfig: default
      storageServiceRetry:
        baseConfig: default
  circuitbreaker:
    instances:
      memberServiceCircuitBreaker:
        baseConfig: default
      storageServiceCircuitBreaker:
        baseConfig: default

# Shared service-to-service secret for the /internal/** routes (see InternalTokenFilter).
internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN}

# Fixed service URLs (compose DNS locally, ECS Service Connect on AWS).
clients:
  member-service:
    url: http://member-service:10010
  storage-service:
    url: http://storage-service:10013
