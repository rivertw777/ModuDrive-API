spring:
  application:
    name: file-service
  config:
    import:
      - "classpath:application-jpa.yml"
      - "classpath:application-observability.yml"
      - "classpath:application-kafka.yml"
      - "classpath:application-resilience4j.yml"
  kafka:
    consumer:
      group-id: file-service
      properties:
        spring.json.trusted.packages: com.moduDrive.common.event.member

modudrive:
  file:
    default-quota-bytes: ${MODUDRIVE_FILE_DEFAULT_QUOTA_BYTES}

resilience4j:
  retry:
    instances:
      memberServiceRetry:
        baseConfig: default
      storageServiceRetry:
        baseConfig: default
  circuitbreaker:
    instances:
      memberServiceCircuitBreaker:
        baseConfig: default
      storageServiceCircuitBreaker:
        baseConfig: default

# Shared service-to-service secret for the /internal/** routes (see InternalTokenFilter).
internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN}
