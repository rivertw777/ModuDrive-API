# Central collector (monitoring.tf) — the AWS twin of .docker/observability/otel-collector-config.yaml
# plus the metrics side Prometheus does locally. Out to Grafana Cloud when grafana_cloud is set (the
# upstream contrib image, as local), else X-Ray and AMP (ADOT).
# Rendered by Terraform (templatefile): $${...} is Terraform's.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
%{ if grafana_cloud != null ~}
  # The token is the task's GRAFANA_CLOUD_TOKEN (from SSM); each endpoint has its own user.
  basicauth/otlp:
    client_auth:
      username: "${grafana_cloud.otlp_user}"
      password: $${env:GRAFANA_CLOUD_TOKEN}
  basicauth/prometheus:
    client_auth:
      username: "${grafana_cloud.prometheus_user}"
      password: $${env:GRAFANA_CLOUD_TOKEN}
%{ else ~}
  sigv4auth:
    region: ${region}
    service: aps
%{ endif ~}
  # Finds every task in the cluster whose container carries ECS_PROMETHEUS_EXPORTER_PORT (ecs.tf) and
  # writes them as Prometheus file_sd targets — task IPs change on every deploy, so no static list.
  ecs_observer:
    cluster_name: ${cluster}
    cluster_region: ${region}
    result_file: /tmp/ecs_sd_targets.yaml
    refresh_interval: 30s
    docker_labels:
      - port_label: ECS_PROMETHEUS_EXPORTER_PORT
        metrics_path_label: ECS_PROMETHEUS_METRICS_PATH

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      global:
        scrape_interval: ${scrape_interval}
      scrape_configs:
        - job_name: services
          file_sd_configs:
            - files: [/tmp/ecs_sd_targets.yaml]
          relabel_configs:
            # "member-service" ... — what the alert rules and messages name a service by (instance is a task IP).
            - source_labels: [__meta_ecs_container_name]
              target_label: service
          # Keep what the alerts and the usual dashboards read, drop the rest (AMP bills per sample,
          # Grafana Cloud's free tier stops at 10k series). Alerting on a new metric → add it here first,
          # or the rule sees nothing.
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'modudrive_.*|resilience4j_circuitbreaker_state|resilience4j_circuitbreaker_not_permitted_calls_total|resilience4j_retry_calls_total|resilience4j_timelimiter_calls_total|http_client_requests_seconds_.*|spring_cloud_gateway_requests_seconds_.*|http_server_requests_seconds_.*|jvm_memory_used_bytes|jvm_memory_max_bytes|jvm_gc_live_data_size_bytes|jvm_gc_max_data_size_bytes|jvm_gc_pause_seconds_.*|jvm_threads_live_threads|process_cpu_usage|hikaricp_connections_.*|lettuce_seconds_.*'
              action: keep
            # Feign's http_url, http_status_code, http_method as uri, status, method — WebClient's and the
            # server metrics' names. An empty value (every other metric) doesn't match (.+) and is left alone.
            - source_labels: [http_url]
              regex: '(.+)'
              target_label: uri
            - source_labels: [http_status_code]
              regex: '(.+)'
              target_label: status
            - source_labels: [http_method]
              regex: '(.+)'
              target_label: method
            - regex: 'http_url|http_status_code|http_method'
              action: labeldrop

processors:
  batch: {}
  # AWS SDK spans (S3, SES) carry no peer.service, so Grafana can't draw "→ target" for them as it does for
  # Redis and the DB. Same as local.
  transform/aws-peer-service:
    trace_statements:
      - set(span.attributes["peer.service"], span.attributes["rpc.service"]) where span.attributes["rpc.system"] == "aws-api" and span.attributes["peer.service"] == nil
  # Same policies as local: errors, over 1s, and 5% of the rest. decision_wait outlasts the gateway's
  # 15s time limiter so a slow request's late spans arrive before the decision.
  tail_sampling:
    decision_wait: 30s
    policies:
      # Health checks and scrapes (ECS health check, Route 53 /readyz, the collector's /actuator/prometheus)
      # are dropped, whole trace. A drop wins over every other policy.
      - name: health-checks
        type: drop
        drop:
          drop_sub_policy:
            - name: health-check-uri
              type: string_attribute
              string_attribute:
                key: uri
                values: ['/actuator/.*', '/readyz']
                enabled_regex_matching: true
      # The health check's Redis INFO runs outside any server span, so it is a trace of its own. The app
      # never sends INFO.
      - name: redis-health-checks
        type: drop
        drop:
          drop_sub_policy:
            - name: redis-info
              type: string_attribute
              string_attribute:
                key: db.operation
                values: [INFO]
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      # Spring leaves the span of a 5xx it answered (exception handler, gateway) unset, not ERROR — kept by
      # the span's status tag (the HTTP status) instead.
      - name: server-errors
        type: string_attribute
        string_attribute:
          key: status
          values: ['5..']
          enabled_regex_matching: true
      - name: slow-requests
        type: latency
        latency:
          threshold_ms: 1000
      - name: baseline-sample
        type: probabilistic
        probabilistic:
          sampling_percentage: 5

exporters:
%{ if grafana_cloud != null ~}
  # Traces to Tempo and logs to Loki, through the stack's OTLP gateway (/v1/traces, /v1/logs).
  otlp_http/grafana-cloud:
    endpoint: ${grafana_cloud.otlp_url}
    auth:
      authenticator: basicauth/otlp
  # Metrics by remote write rather than OTLP, so they land with the same names and labels as local.
  prometheus_remote_write:
    endpoint: ${grafana_cloud.prometheus_url}/api/prom/push
    auth:
      authenticator: basicauth/prometheus
%{ else ~}
  awsxray:
    region: ${region}
    # Attributes become unsearchable metadata unless listed here. "user.id" lands as annotation user_id:
    # X-Ray filter `annotation.user_id = "<uuid>"` (Tempo's `{ span.user.id = "<uuid>" }` locally).
    indexed_attributes: [user.id]
  prometheus_remote_write:
    endpoint: ${amp_endpoint}api/v1/remote_write
    auth:
      authenticator: sigv4auth
%{ endif ~}

service:
%{ if grafana_cloud != null ~}
  extensions: [health_check, basicauth/otlp, basicauth/prometheus, ecs_observer]
%{ else ~}
  extensions: [health_check, sigv4auth, ecs_observer]
%{ endif ~}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/aws-peer-service, tail_sampling, batch]
      exporters: [${grafana_cloud != null ? "otlp_http/grafana-cloud" : "awsxray"}]
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [prometheus_remote_write]
%{ if grafana_cloud != null ~}
    # Not sampled, like local: a request whose trace was dropped still has its logs, with the trace id.
    # Without Grafana Cloud the logs reach CloudWatch from stdout only (awslogs), and the services
    # don't export them (ecs.tf).
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/grafana-cloud]
%{ endif ~}
