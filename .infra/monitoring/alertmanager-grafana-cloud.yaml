# Grafana Cloud alertmanager (monitoring.tf): .docker/observability/alertmanager.yml with the webhook URLs
# inline — routing, channels and the message (discord.tmpl) are the same. Rendered by Terraform (templatefile).
alertmanager_config: |
  route:
    receiver: service
    group_by: [alertname]
    group_interval: 1m
    repeat_interval: 4h
    routes:
      - receiver: heartbeat
        matchers: [channel="heartbeat"]
        group_wait: 0s
        repeat_interval: 5m
      - receiver: messaging
        matchers: [channel="messaging"]
%{ if night_stop ~}
        mute_time_intervals: [night]
%{ endif ~}
      - receiver: infra
        matchers: [channel="infra"]
%{ if night_stop ~}
        mute_time_intervals: [night]
      # The root route can't take a mute interval, so the rest goes through this one.
      - receiver: service
        mute_time_intervals: [night]
%{ endif ~}
%{ if night_stop ~}
  # night_stop.tf: the stack sleeps 00:00–08:00 and has until 08:20 to come back.
  time_intervals:
    - name: night
      time_intervals:
        - times: [{ start_time: "00:00", end_time: "08:20" }]
          location: Asia/Seoul
%{ endif ~}
  inhibit_rules:
    - source_matchers: [alertname=~"ServiceDown|ServiceNoTasks"]
      target_matchers: [alertname=~"CircuitOpen|RouteErrorRate|RouteSlowRate"]
      equal: [target]
    - source_matchers: [alertname="CollectorDown"]
      target_matchers: [alertname="ServiceNoTasks"]
  templates:
    - discord
  receivers:
    # No URL in SSM yet: the pings are dropped, as local.
    - name: heartbeat
%{ if heartbeat_url != null ~}
      webhook_configs:
        - url: ${heartbeat_url}
          send_resolved: false
%{ endif ~}
%{ for channel, url in webhooks ~}
    - name: ${channel}
      discord_configs:
        - webhook_url: ${url}
          content: '{{ template "discord.content" . }}'
          title: '{{ template "discord.title" . }}'
          message: ''
%{ endfor ~}
template_files:
  discord: |
    ${indent(4, discord_template)}
