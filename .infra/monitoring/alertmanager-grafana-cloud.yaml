# Grafana Cloud alertmanager (monitoring.tf): .docker/observability/alertmanager.yml with the webhook URLs
# inline — routing, channels and the message (discord.tmpl) are the same. Rendered by Terraform (templatefile).
alertmanager_config: |
  route:
    receiver: service
    group_by: [alertname]
    group_interval: 1m
    repeat_interval: 4h
    routes:
      - receiver: heartbeat
        matchers: [channel="heartbeat"]
        group_wait: 0s
        repeat_interval: 5m
      - receiver: messaging
        matchers: [channel="messaging"]
      - receiver: infra
        matchers: [channel="infra"]
  templates:
    - discord
  receivers:
    # No URL in SSM yet: the pings are dropped, as local.
    - name: heartbeat
%{ if heartbeat_url != null ~}
      webhook_configs:
        - url: ${heartbeat_url}
          send_resolved: false
%{ endif ~}
%{ for channel, url in webhooks ~}
    - name: ${channel}
      discord_configs:
        - webhook_url: ${url}
          content: '{{ template "discord.content" . }}'
          title: '{{ template "discord.title" . }}'
          message: ''
%{ endfor ~}
template_files:
  discord: |
    ${indent(4, discord_template)}
