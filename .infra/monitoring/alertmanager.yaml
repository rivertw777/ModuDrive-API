# AMP alertmanager (monitoring.tf): the same routing as local (.docker/observability/alertmanager.yml),
# out through SNS to the Discord forwarder Lambda. The message is discord.tmpl, shared with local. The
# channel attribute picks the webhook. Rendered by Terraform (templatefile).
alertmanager_config: |
  route:
    receiver: service
    group_by: [alertname]
    group_interval: 1m
    repeat_interval: 4h
    routes:
      - receiver: messaging
        matchers: [channel="messaging"]
  templates:
    - discord
  receivers:
    - name: messaging
      sns_configs:
        - topic_arn: ${topic_arn}
          sigv4:
            region: ${region}
          subject: '{{ .CommonLabels.alertname }}'
          message: '{{ template "discord.message" . }}'
          attributes:
            channel: messaging
    - name: service
      sns_configs:
        - topic_arn: ${topic_arn}
          sigv4:
            region: ${region}
          subject: '{{ .CommonLabels.alertname }}'
          message: '{{ template "discord.message" . }}'
          attributes:
            channel: service
template_files:
  discord: |
    ${indent(4, discord_template)}
