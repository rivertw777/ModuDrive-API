# AMP alertmanager (monitoring.tf): the same routing as local (.docker/observability/alertmanager.yml),
# out through SNS to the Discord forwarder Lambda. The message is discord.tmpl, shared with local. The
# channel attribute picks the webhook. Rendered by Terraform (templatefile).
alertmanager_config: |
  route:
    receiver: service
    group_by: [alertname]
    group_interval: 1m
    repeat_interval: 4h
    routes:
      - receiver: heartbeat
        matchers: [channel="heartbeat"]
        group_wait: 0s
        repeat_interval: 5m
      - receiver: messaging
        matchers: [channel="messaging"]
      - receiver: infra
        matchers: [channel="infra"]
  inhibit_rules:
    - source_matchers: [alertname=~"ServiceDown|ServiceNoTasks"]
      target_matchers: [alertname=~"CircuitOpen|RouteErrorRate|RouteSlowRate"]
      equal: [target]
    - source_matchers: [alertname="CollectorDown"]
      target_matchers: [alertname="ServiceNoTasks"]
  templates:
    - discord
  receivers:
    # The Lambda pings the heartbeat service instead of posting to Discord — so the ping proves SNS and
    # the Lambda alive too.
    - name: heartbeat
      sns_configs:
        - topic_arn: ${topic_arn}
          sigv4:
            region: ${region}
          subject: Watchdog
          message: heartbeat
          send_resolved: false
          attributes:
            channel: heartbeat
    - name: messaging
      sns_configs:
        - topic_arn: ${topic_arn}
          sigv4:
            region: ${region}
          subject: '{{ .CommonLabels.alertname }}'
          message: '{{ template "discord.message" . }}'
          attributes:
            channel: messaging
    - name: service
      sns_configs:
        - topic_arn: ${topic_arn}
          sigv4:
            region: ${region}
          subject: '{{ .CommonLabels.alertname }}'
          message: '{{ template "discord.message" . }}'
          attributes:
            channel: service
    - name: infra
      sns_configs:
        - topic_arn: ${topic_arn}
          sigv4:
            region: ${region}
          subject: '{{ .CommonLabels.alertname }}'
          message: '{{ template "discord.message" . }}'
          attributes:
            channel: infra
template_files:
  discord: |
    ${indent(4, discord_template)}
